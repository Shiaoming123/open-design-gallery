<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GOV.UK Design System Typography</title>
    <style>
:root {
  --bg: #ffffff;
  --surface: #f4f8fb;
  --surface-warm: #f3f3f3;
  --fg: #0b0c0c;
  --fg-2: #484949;
  --muted: #484949;
  --meta: #1d70b8;
  --border: #cecece;
  --border-soft: #d2e2f1;
  --accent: #00703c;
  --accent-on: #ffffff;
  --accent-hover: #005a30;
  --accent-active: #00401f;
  --success: #0f7a52;
  --warn: #ffdd00;
  --danger: #ca3535;
  --font-display: "GDS Transport", Arial, sans-serif;
  --font-body: "GDS Transport", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --text-xs: 14px;
  --text-sm: 16px;
  --text-base: 19px;
  --text-lg: 24px;
  --text-xl: 27px;
  --text-2xl: 36px;
  --text-3xl: 48px;
  --text-4xl: 80px;
  --leading-body: 1.315;
  --leading-tight: 1.05;
  --tracking-display: 0;
  --space-1: 5px;
  --space-2: 10px;
  --space-3: 15px;
  --space-4: 20px;
  --space-5: 25px;
  --space-6: 30px;
  --space-8: 50px;
  --space-12: 60px;
  --section-y-desktop: 60px;
  --section-y-tablet: 50px;
  --section-y-phone: 40px;
  --radius-sm: 0;
  --radius-md: 0;
  --radius-lg: 0;
  --radius-pill: 9999px;
  --elev-flat: none;
  --elev-ring: 0 0 0 1px var(--border);
  --elev-raised: 0 2px 0 #929191;
  --focus-ring: 0 0 0 3px var(--warn);
  --motion-fast: 120ms;
  --motion-base: 180ms;
  --ease-standard: cubic-bezier(0.23, 1, 0.32, 1);
  --container-max: 960px;
  --container-gutter-desktop: 30px;
  --container-gutter-tablet: 25px;
  --container-gutter-phone: 15px;
}

      body { margin: 0; background: var(--bg); color: var(--fg); font: var(--text-base, 14px)/var(--leading-body, 1.5) var(--font-body, system-ui, sans-serif); }
      main { max-width: 860px; margin: 0 auto; padding: var(--space-12, 48px) var(--space-6, 24px); }
      .sample { padding: var(--space-4, 16px) 0; border-bottom: 1px solid var(--border-soft, #e5e5e5); }
      .name { color: var(--muted); font-size: var(--text-sm, 12px); margin-bottom: var(--space-2, 8px); }
      .display { font: 600 var(--text-3xl, 28px)/var(--leading-tight, 1.15) var(--font-display, inherit); letter-spacing: var(--tracking-display, 0); }
      .body { color: var(--fg-2, var(--fg)); }
      .small { font-size: var(--text-sm, 12px); color: var(--muted); }
      .code { font-family: var(--font-mono, monospace); font-size: var(--text-sm, 12px); }
    </style>
  </head>
  <body>
    <main>
      <section class="sample"><div class="name">Display</div><div class="display">GOV.UK Design System</div></section>
      <section class="sample"><div class="name">Body</div><div class="body">Captured design systems should stay readable, reusable, and faithful to the source evidence.</div></section>
      <section class="sample"><div class="name">Small UI</div><div class="small">Metadata, labels, counters, and quiet supporting text.</div></section>
      <section class="sample"><div class="name">Code</div><div class="code">--accent: var(--accent);</div></section>
    </main>
  </body>
</html>
