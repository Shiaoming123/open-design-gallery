<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zendesk Garden Spacing</title>
    <style>
/* Open Design tokens for Zendesk Garden, distilled from public Garden docs and Garden React. */

:root {
  --bg: #f8f9f9;
  --surface: #ffffff;
  --surface-warm: #edf7ff;

  --fg: #293239;
  --fg-2: #39434b;
  --muted: #5c6970;
  --meta: #848f99;

  --border: #d8dcde;
  --border-soft: #e8eaec;

  --accent: #1f73b7;
  --accent-on: #ffffff;
  --accent-hover: #13456d;
  --accent-active: #0f3655;

  --success: #037f52;
  --warn: #ac5918;
  --danger: #cd3642;

  --font-display: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-body: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: SFMono-Regular, Consolas, "Liberation Mono", Menlo, Courier, monospace;

  --text-xs: 10px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-lg: 18px;
  --text-xl: 22px;
  --text-2xl: 26px;
  --text-3xl: 36px;
  --text-4xl: 44px;

  --leading-body: 1.43;
  --leading-tight: 1.2;
  --tracking-display: 0;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;

  --section-y-desktop: 64px;
  --section-y-tablet: 48px;
  --section-y-phone: 32px;

  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 8px;
  --radius-pill: 9999px;

  --elev-flat: none;
  --elev-ring: 0 0 0 1px var(--border);
  --elev-raised: 0 20px 24px color-mix(in oklab, var(--fg), transparent 88%);

  --focus-ring: 0 0 0 3px color-mix(in oklab, var(--accent), transparent 68%);

  --motion-fast: 100ms;
  --motion-base: 160ms;
  --ease-standard: ease-in-out;

  --container-max: 1184px;
  --container-gutter-desktop: 40px;
  --container-gutter-tablet: 24px;
  --container-gutter-phone: 16px;
}

      body { margin: 0; background: var(--bg); color: var(--fg); font: var(--text-base, 14px)/var(--leading-body, 1.5) var(--font-body, system-ui, sans-serif); }
      main { max-width: 860px; margin: 0 auto; padding: var(--space-12, 48px) var(--space-6, 24px); }
      h1 { margin: 0 0 var(--space-6, 24px); font-size: var(--text-3xl, 28px); line-height: var(--leading-tight, 1.15); }
      .row { display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: var(--space-4, 16px); margin-bottom: var(--space-3, 12px); }
      .bar { height: 18px; width: var(--size); background: var(--accent); border-radius: var(--radius-sm, 6px); }
      .label { color: var(--muted); font-family: var(--font-mono, monospace); font-size: var(--text-sm, 12px); }
    </style>
  </head>
  <body>
    <main>
      <h1>Zendesk Garden spacing scale</h1>
      <div class="row"><div class="label">--space-1</div><div class="bar" style="--size: var(--space-1, 4px)"></div></div>
      <div class="row"><div class="label">--space-2</div><div class="bar" style="--size: var(--space-2, 8px)"></div></div>
      <div class="row"><div class="label">--space-3</div><div class="bar" style="--size: var(--space-3, 12px)"></div></div>
      <div class="row"><div class="label">--space-4</div><div class="bar" style="--size: var(--space-4, 16px)"></div></div>
      <div class="row"><div class="label">--space-6</div><div class="bar" style="--size: var(--space-6, 24px)"></div></div>
      <div class="row"><div class="label">--space-8</div><div class="bar" style="--size: var(--space-8, 32px)"></div></div>
      <div class="row"><div class="label">--space-12</div><div class="bar" style="--size: var(--space-12, 48px)"></div></div>
    </main>
  </body>
</html>
