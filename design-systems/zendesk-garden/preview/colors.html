<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zendesk Garden Colors</title>
    <style>
/* Open Design tokens for Zendesk Garden, distilled from public Garden docs and Garden React. */

:root {
  --bg: #f8f9f9;
  --surface: #ffffff;
  --surface-warm: #edf7ff;

  --fg: #293239;
  --fg-2: #39434b;
  --muted: #5c6970;
  --meta: #848f99;

  --border: #d8dcde;
  --border-soft: #e8eaec;

  --accent: #1f73b7;
  --accent-on: #ffffff;
  --accent-hover: #13456d;
  --accent-active: #0f3655;

  --success: #037f52;
  --warn: #ac5918;
  --danger: #cd3642;

  --font-display: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-body: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: SFMono-Regular, Consolas, "Liberation Mono", Menlo, Courier, monospace;

  --text-xs: 10px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-lg: 18px;
  --text-xl: 22px;
  --text-2xl: 26px;
  --text-3xl: 36px;
  --text-4xl: 44px;

  --leading-body: 1.43;
  --leading-tight: 1.2;
  --tracking-display: 0;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;

  --section-y-desktop: 64px;
  --section-y-tablet: 48px;
  --section-y-phone: 32px;

  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 8px;
  --radius-pill: 9999px;

  --elev-flat: none;
  --elev-ring: 0 0 0 1px var(--border);
  --elev-raised: 0 20px 24px color-mix(in oklab, var(--fg), transparent 88%);

  --focus-ring: 0 0 0 3px color-mix(in oklab, var(--accent), transparent 68%);

  --motion-fast: 100ms;
  --motion-base: 160ms;
  --ease-standard: ease-in-out;

  --container-max: 1184px;
  --container-gutter-desktop: 40px;
  --container-gutter-tablet: 24px;
  --container-gutter-phone: 16px;
}

      body { margin: 0; background: var(--bg); color: var(--fg); font: var(--text-base, 14px)/var(--leading-body, 1.5) var(--font-body, system-ui, sans-serif); }
      main { max-width: 920px; margin: 0 auto; padding: var(--space-12, 48px) var(--space-6, 24px); }
      h1 { margin: 0 0 var(--space-6, 24px); font-size: var(--text-3xl, 28px); line-height: var(--leading-tight, 1.15); }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-3, 12px); }
      .swatch { border: 1px solid var(--border-soft, #e5e5e5); border-radius: var(--radius-md, 8px); background: var(--surface, #fff); overflow: hidden; }
      .chip { height: 84px; background: var(--color); }
      .meta { padding: var(--space-3, 12px); color: var(--muted, #666); font-family: var(--font-mono, monospace); font-size: var(--text-sm, 12px); }
    </style>
  </head>
  <body>
    <main>
      <h1>Zendesk Garden color roles</h1>
      <section class="grid" aria-label="Color swatches">
        <div class="swatch" style="--color: var(--bg)"><div class="chip"></div><div class="meta">--bg</div></div>
        <div class="swatch" style="--color: var(--surface)"><div class="chip"></div><div class="meta">--surface</div></div>
        <div class="swatch" style="--color: var(--fg)"><div class="chip"></div><div class="meta">--fg</div></div>
        <div class="swatch" style="--color: var(--accent)"><div class="chip"></div><div class="meta">--accent</div></div>
        <div class="swatch" style="--color: var(--success)"><div class="chip"></div><div class="meta">--success</div></div>
        <div class="swatch" style="--color: var(--danger)"><div class="chip"></div><div class="meta">--danger</div></div>
      </section>
    </main>
  </body>
</html>
