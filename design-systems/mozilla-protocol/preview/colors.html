<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mozilla Protocol Colors</title>
    <style>
/* Open Design tokens for Mozilla Protocol, distilled from public Protocol docs. */

:root {
  --bg: #ffffff;
  --surface: #f9f9fb;
  --surface-warm: #ededf0;

  --fg: #000000;
  --fg-2: #20123a;
  --muted: #5e5e72;
  --meta: #6f7787;

  --border: #d7d7db;
  --border-soft: #ededf0;

  --accent: #0060df;
  --accent-on: #ffffff;
  --accent-hover: #0250bb;
  --accent-active: #054096;

  --success: #008787;
  --warn: #ffbd4f;
  --danger: #d70022;

  --font-display: "Mozilla Headline", "Metropolis", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: "Mozilla Text", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;

  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-lg: 20px;
  --text-xl: 24px;
  --text-2xl: 32px;
  --text-3xl: 48px;
  --text-4xl: 64px;

  --leading-body: 1.5;
  --leading-tight: 1.08;
  --tracking-display: -0.01em;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;

  --section-y-desktop: 80px;
  --section-y-tablet: 56px;
  --section-y-phone: 40px;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 9999px;

  --elev-flat: none;
  --elev-ring: 0 0 0 1px var(--border);
  --elev-raised: 0 8px 24px color-mix(in oklab, var(--fg), transparent 90%);

  --focus-ring: 0 0 0 3px color-mix(in oklab, var(--accent), transparent 68%);

  --motion-fast: 120ms;
  --motion-base: 180ms;
  --ease-standard: cubic-bezier(0.23, 1, 0.32, 1);

  --container-max: 1200px;
  --container-gutter-desktop: 48px;
  --container-gutter-tablet: 32px;
  --container-gutter-phone: 20px;
}

      body { margin: 0; background: var(--bg); color: var(--fg); font: var(--text-base, 14px)/var(--leading-body, 1.5) var(--font-body, system-ui, sans-serif); }
      main { max-width: 920px; margin: 0 auto; padding: var(--space-12, 48px) var(--space-6, 24px); }
      h1 { margin: 0 0 var(--space-6, 24px); font-size: var(--text-3xl, 28px); line-height: var(--leading-tight, 1.15); }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-3, 12px); }
      .swatch { border: 1px solid var(--border-soft, #e5e5e5); border-radius: var(--radius-md, 8px); background: var(--surface, #fff); overflow: hidden; }
      .chip { height: 84px; background: var(--color); }
      .meta { padding: var(--space-3, 12px); color: var(--muted, #666); font-family: var(--font-mono, monospace); font-size: var(--text-sm, 12px); }
    </style>
  </head>
  <body>
    <main>
      <h1>Mozilla Protocol color roles</h1>
      <section class="grid" aria-label="Color swatches">
        <div class="swatch" style="--color: var(--bg)"><div class="chip"></div><div class="meta">--bg</div></div>
        <div class="swatch" style="--color: var(--surface)"><div class="chip"></div><div class="meta">--surface</div></div>
        <div class="swatch" style="--color: var(--fg)"><div class="chip"></div><div class="meta">--fg</div></div>
        <div class="swatch" style="--color: var(--accent)"><div class="chip"></div><div class="meta">--accent</div></div>
        <div class="swatch" style="--color: var(--success)"><div class="chip"></div><div class="meta">--success</div></div>
        <div class="swatch" style="--color: var(--danger)"><div class="chip"></div><div class="meta">--danger</div></div>
      </section>
    </main>
  </body>
</html>
