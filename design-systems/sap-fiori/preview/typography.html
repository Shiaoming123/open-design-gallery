<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SAP Fiori Typography</title>
    <style>
/* design-systems/sap-fiori/tokens.css
 *
 * Open Design token bindings distilled from official SAP Fiori web guidelines.
 */

:root {
  --bg: #f5f6f7;
  --surface: #ffffff;
  --surface-warm: #eff1f2;
  --fg: #131e29;
  --fg-2: #223548;
  --muted: #556b82;
  --meta: #788fa6;
  --border: #d9d9d9;
  --border-soft: #e5e5e5;
  --accent: #0070f2;
  --accent-on: #ffffff;
  --accent-hover: #0057d2;
  --accent-active: #0040a8;
  --success: #256f3a;
  --warn: #d27700;
  --danger: #aa0808;
  --font-display: "72", "SAP 72", Arial, Helvetica, sans-serif;
  --font-body: "72", "SAP 72", Arial, Helvetica, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-lg: 18px;
  --text-xl: 22px;
  --text-2xl: 28px;
  --text-3xl: 36px;
  --text-4xl: 48px;
  --leading-body: 1.5;
  --leading-tight: 1.15;
  --tracking-display: 0;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --section-y-desktop: 56px;
  --section-y-tablet: 40px;
  --section-y-phone: 28px;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 9999px;
  --elev-flat: none;
  --elev-ring: 0 0 0 1px var(--border);
  --elev-raised: 0 8px 24px rgba(19, 30, 41, 0.12);
  --focus-ring: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent);
  --motion-fast: 120ms;
  --motion-base: 200ms;
  --ease-standard: cubic-bezier(0.23, 1, 0.32, 1);
  --container-max: 1280px;
  --container-gutter-desktop: 32px;
  --container-gutter-tablet: 24px;
  --container-gutter-phone: 16px;
}

      body { margin: 0; background: var(--bg); color: var(--fg); font: var(--text-base, 14px)/var(--leading-body, 1.5) var(--font-body, system-ui, sans-serif); }
      main { max-width: 860px; margin: 0 auto; padding: var(--space-12, 48px) var(--space-6, 24px); }
      .sample { padding: var(--space-4, 16px) 0; border-bottom: 1px solid var(--border-soft, #e5e5e5); }
      .name { color: var(--muted); font-size: var(--text-sm, 12px); margin-bottom: var(--space-2, 8px); }
      .display { font: 600 var(--text-3xl, 28px)/var(--leading-tight, 1.15) var(--font-display, inherit); letter-spacing: var(--tracking-display, 0); }
      .body { color: var(--fg-2, var(--fg)); }
      .small { font-size: var(--text-sm, 12px); color: var(--muted); }
      .code { font-family: var(--font-mono, monospace); font-size: var(--text-sm, 12px); }
    </style>
  </head>
  <body>
    <main>
      <section class="sample"><div class="name">Display</div><div class="display">SAP Fiori</div></section>
      <section class="sample"><div class="name">Body</div><div class="body">Captured design systems should stay readable, reusable, and faithful to the source evidence.</div></section>
      <section class="sample"><div class="name">Small UI</div><div class="small">Metadata, labels, counters, and quiet supporting text.</div></section>
      <section class="sample"><div class="name">Code</div><div class="code">--accent: var(--accent);</div></section>
    </main>
  </body>
</html>
