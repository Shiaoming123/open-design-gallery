<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Palantir Blueprint Typography</title>
    <style>
/* design-systems/palantir-blueprint/tokens.css
 *
 * Open Design token bindings distilled from public Blueprint docs and repo
 * pages. Values are original OD mappings to the shared schema; do not copy
 * official screenshots, assets, or source into this package.
 */

:root {
  --bg: #f5f8fa;
  --surface: #ffffff;
  --surface-warm: #ebf1f5;
  --fg: #1c2127;
  --fg-2: #383e47;
  --muted: #5f6b7a;
  --meta: #738091;
  --border: #c5cbd3;
  --border-soft: #d8e1e8;
  --accent: #2d72d2;
  --accent-on: #ffffff;
  --accent-hover: #215db0;
  --accent-active: #184a90;
  --success: #238551;
  --warn: #c87619;
  --danger: #c23030;
  --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-lg: 18px;
  --text-xl: 22px;
  --text-2xl: 28px;
  --text-3xl: 36px;
  --text-4xl: 48px;
  --leading-body: 1.45;
  --leading-tight: 1.12;
  --tracking-display: 0;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --section-y-desktop: 64px;
  --section-y-tablet: 48px;
  --section-y-phone: 32px;
  --radius-sm: 3px;
  --radius-md: 4px;
  --radius-lg: 6px;
  --radius-pill: 9999px;
  --elev-flat: none;
  --elev-ring: 0 0 0 1px var(--border);
  --elev-raised: 0 2px 4px rgba(17, 20, 24, 0.14), 0 8px 24px rgba(17, 20, 24, 0.12);
  --focus-ring: 0 0 0 3px rgba(45, 114, 210, 0.3);
  --motion-fast: 100ms;
  --motion-base: 160ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --container-max: 1180px;
  --container-gutter-desktop: 32px;
  --container-gutter-tablet: 24px;
  --container-gutter-phone: 16px;
}

      body { margin: 0; background: var(--bg); color: var(--fg); font: var(--text-base, 14px)/var(--leading-body, 1.5) var(--font-body, system-ui, sans-serif); }
      main { max-width: 860px; margin: 0 auto; padding: var(--space-12, 48px) var(--space-6, 24px); }
      .sample { padding: var(--space-4, 16px) 0; border-bottom: 1px solid var(--border-soft, #e5e5e5); }
      .name { color: var(--muted); font-size: var(--text-sm, 12px); margin-bottom: var(--space-2, 8px); }
      .display { font: 600 var(--text-3xl, 28px)/var(--leading-tight, 1.15) var(--font-display, inherit); letter-spacing: var(--tracking-display, 0); }
      .body { color: var(--fg-2, var(--fg)); }
      .small { font-size: var(--text-sm, 12px); color: var(--muted); }
      .code { font-family: var(--font-mono, monospace); font-size: var(--text-sm, 12px); }
    </style>
  </head>
  <body>
    <main>
      <section class="sample"><div class="name">Display</div><div class="display">Palantir Blueprint</div></section>
      <section class="sample"><div class="name">Body</div><div class="body">Captured design systems should stay readable, reusable, and faithful to the source evidence.</div></section>
      <section class="sample"><div class="name">Small UI</div><div class="small">Metadata, labels, counters, and quiet supporting text.</div></section>
      <section class="sample"><div class="name">Code</div><div class="code">--accent: var(--accent);</div></section>
    </main>
  </body>
</html>
