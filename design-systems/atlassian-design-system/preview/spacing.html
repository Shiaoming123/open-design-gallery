<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atlassian Design System Spacing</title>
    <style>
/* design-systems/atlassian-design-system/tokens.css
 *
 * Open Design token bindings distilled from public Atlassian Design System
 * foundations. Values are original OD mappings to the shared schema; do not
 * copy official source, screenshots, or assets into this package.
 */

:root {
  --bg: #f7f8f9;
  --surface: #ffffff;
  --surface-warm: #f1f2f4;
  --fg: #172b4d;
  --fg-2: #44546f;
  --muted: #626f86;
  --meta: #8590a2;
  --border: #dcdfe4;
  --border-soft: #f1f2f4;
  --accent: #0c66e4;
  --accent-on: #ffffff;
  --accent-hover: #0055cc;
  --accent-active: #09326c;
  --success: #22a06b;
  --warn: #f5cd47;
  --danger: #c9372c;
  --font-display: "Charlie Display", "Atlassian Sans", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: "Atlassian Sans", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "Atlassian Mono", ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-lg: 18px;
  --text-xl: 24px;
  --text-2xl: 32px;
  --text-3xl: 48px;
  --text-4xl: 64px;
  --leading-body: 1.5;
  --leading-tight: 1.12;
  --tracking-display: -0.012em;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --section-y-desktop: 80px;
  --section-y-tablet: 56px;
  --section-y-phone: 40px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 9999px;
  --elev-flat: none;
  --elev-ring: 0 0 0 1px var(--border);
  --elev-raised: 0 8px 16px rgba(9, 30, 66, 0.15), 0 0 1px rgba(9, 30, 66, 0.31);
  --focus-ring: 0 0 0 3px rgba(12, 102, 228, 0.28);
  --motion-fast: 120ms;
  --motion-base: 200ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --container-max: 1200px;
  --container-gutter-desktop: 32px;
  --container-gutter-tablet: 24px;
  --container-gutter-phone: 16px;
}

      body { margin: 0; background: var(--bg); color: var(--fg); font: var(--text-base, 14px)/var(--leading-body, 1.5) var(--font-body, system-ui, sans-serif); }
      main { max-width: 860px; margin: 0 auto; padding: var(--space-12, 48px) var(--space-6, 24px); }
      h1 { margin: 0 0 var(--space-6, 24px); font-size: var(--text-3xl, 28px); line-height: var(--leading-tight, 1.15); }
      .row { display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: var(--space-4, 16px); margin-bottom: var(--space-3, 12px); }
      .bar { height: 18px; width: var(--size); background: var(--accent); border-radius: var(--radius-sm, 6px); }
      .label { color: var(--muted); font-family: var(--font-mono, monospace); font-size: var(--text-sm, 12px); }
    </style>
  </head>
  <body>
    <main>
      <h1>Atlassian Design System spacing scale</h1>
      <div class="row"><div class="label">--space-1</div><div class="bar" style="--size: var(--space-1, 4px)"></div></div>
      <div class="row"><div class="label">--space-2</div><div class="bar" style="--size: var(--space-2, 8px)"></div></div>
      <div class="row"><div class="label">--space-3</div><div class="bar" style="--size: var(--space-3, 12px)"></div></div>
      <div class="row"><div class="label">--space-4</div><div class="bar" style="--size: var(--space-4, 16px)"></div></div>
      <div class="row"><div class="label">--space-6</div><div class="bar" style="--size: var(--space-6, 24px)"></div></div>
      <div class="row"><div class="label">--space-8</div><div class="bar" style="--size: var(--space-8, 32px)"></div></div>
      <div class="row"><div class="label">--space-12</div><div class="bar" style="--size: var(--space-12, 48px)"></div></div>
    </main>
  </body>
</html>
