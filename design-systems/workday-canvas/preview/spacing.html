<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workday Canvas Spacing</title>
    <style>
/* Open Design tokens for Workday Canvas, distilled from public Canvas docs, Canvas Kit, and Canvas Tokens. */

:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --surface-warm: #edf4ff;

  --fg: #1f2933;
  --fg-2: #334155;
  --muted: #5f6b7a;
  --meta: #7b8794;

  --border: #d7dde5;
  --border-soft: #e7ebf0;

  --accent: #005cb9;
  --accent-on: #ffffff;
  --accent-hover: #004387;
  --accent-active: #00315f;

  --success: #16803c;
  --warn: #a15c00;
  --danger: #c7291c;

  --font-display: Roboto, "Noto Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: Roboto, "Noto Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "Roboto Mono", "SF Mono", Consolas, Menlo, monospace;

  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-lg: 18px;
  --text-xl: 22px;
  --text-2xl: 28px;
  --text-3xl: 40px;
  --text-4xl: 56px;

  --leading-body: 1.5;
  --leading-tight: 1.18;
  --tracking-display: 0;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;

  --section-y-desktop: 80px;
  --section-y-tablet: 56px;
  --section-y-phone: 36px;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-pill: 9999px;

  --elev-flat: none;
  --elev-ring: 0 0 0 1px var(--border);
  --elev-raised: 0 2px 4px rgba(31, 41, 51, 0.12), 0 8px 16px rgba(31, 41, 51, 0.08);

  --focus-ring: 0 0 0 3px color-mix(in oklab, var(--accent), transparent 70%);

  --motion-fast: 150ms;
  --motion-base: 200ms;
  --ease-standard: cubic-bezier(0.2, 0, 0.2, 1);

  --container-max: 1280px;
  --container-gutter-desktop: 40px;
  --container-gutter-tablet: 24px;
  --container-gutter-phone: 16px;
}

      body { margin: 0; background: var(--bg); color: var(--fg); font: var(--text-base, 14px)/var(--leading-body, 1.5) var(--font-body, system-ui, sans-serif); }
      main { max-width: 860px; margin: 0 auto; padding: var(--space-12, 48px) var(--space-6, 24px); }
      h1 { margin: 0 0 var(--space-6, 24px); font-size: var(--text-3xl, 28px); line-height: var(--leading-tight, 1.15); }
      .row { display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: var(--space-4, 16px); margin-bottom: var(--space-3, 12px); }
      .bar { height: 18px; width: var(--size); background: var(--accent); border-radius: var(--radius-sm, 6px); }
      .label { color: var(--muted); font-family: var(--font-mono, monospace); font-size: var(--text-sm, 12px); }
    </style>
  </head>
  <body>
    <main>
      <h1>Workday Canvas spacing scale</h1>
      <div class="row"><div class="label">--space-1</div><div class="bar" style="--size: var(--space-1, 4px)"></div></div>
      <div class="row"><div class="label">--space-2</div><div class="bar" style="--size: var(--space-2, 8px)"></div></div>
      <div class="row"><div class="label">--space-3</div><div class="bar" style="--size: var(--space-3, 12px)"></div></div>
      <div class="row"><div class="label">--space-4</div><div class="bar" style="--size: var(--space-4, 16px)"></div></div>
      <div class="row"><div class="label">--space-6</div><div class="bar" style="--size: var(--space-6, 24px)"></div></div>
      <div class="row"><div class="label">--space-8</div><div class="bar" style="--size: var(--space-8, 32px)"></div></div>
      <div class="row"><div class="label">--space-12</div><div class="bar" style="--size: var(--space-12, 48px)"></div></div>
    </main>
  </body>
</html>
