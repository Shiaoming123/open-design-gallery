<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AWS Cloudscape Colors</title>
    <style>
/* design-systems/aws-cloudscape/tokens.css
 *
 * Open Design schema tokens for AWS Cloudscape-inspired cloud operations UI.
 * Distilled from public Cloudscape foundation guidance; no official assets copied.
 */

:root {
  --bg: #f2f3f3;
  --surface: #ffffff;
  --surface-warm: #f9fafa;
  --fg: #16191f;
  --fg-2: #414d5c;
  --muted: #5f6b7a;
  --meta: #6b7280;
  --border: #d5dbdb;
  --border-soft: #eaeded;
  --accent: #0972d3;
  --accent-on: #ffffff;
  --accent-hover: #033160;
  --accent-active: #001a37;
  --success: #037f0c;
  --warn: #b35c00;
  --danger: #d91515;
  --font-display: "Amazon Ember", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Amazon Ember", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Amazon Ember Mono", "SFMono-Regular", Consolas, monospace;
  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-lg: 18px;
  --text-xl: 22px;
  --text-2xl: 28px;
  --text-3xl: 36px;
  --text-4xl: 44px;
  --leading-body: 1.5;
  --leading-tight: 1.18;
  --tracking-display: 0;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --section-y-desktop: 72px;
  --section-y-tablet: 56px;
  --section-y-phone: 40px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 9999px;
  --elev-flat: none;
  --elev-ring: 0 0 0 1px var(--border);
  --elev-raised: 0 12px 32px rgba(22, 25, 31, 0.16);
  --focus-ring: 0 0 0 3px rgba(9, 114, 211, 0.32);
  --motion-fast: 120ms;
  --motion-base: 180ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --container-max: 1280px;
  --container-gutter-desktop: 40px;
  --container-gutter-tablet: 28px;
  --container-gutter-phone: 20px;
}

      body { margin: 0; background: var(--bg); color: var(--fg); font: var(--text-base, 14px)/var(--leading-body, 1.5) var(--font-body, system-ui, sans-serif); }
      main { max-width: 920px; margin: 0 auto; padding: var(--space-12, 48px) var(--space-6, 24px); }
      h1 { margin: 0 0 var(--space-6, 24px); font-size: var(--text-3xl, 28px); line-height: var(--leading-tight, 1.15); }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-3, 12px); }
      .swatch { border: 1px solid var(--border-soft, #e5e5e5); border-radius: var(--radius-md, 8px); background: var(--surface, #fff); overflow: hidden; }
      .chip { height: 84px; background: var(--color); }
      .meta { padding: var(--space-3, 12px); color: var(--muted, #666); font-family: var(--font-mono, monospace); font-size: var(--text-sm, 12px); }
    </style>
  </head>
  <body>
    <main>
      <h1>AWS Cloudscape color roles</h1>
      <section class="grid" aria-label="Color swatches">
        <div class="swatch" style="--color: var(--bg)"><div class="chip"></div><div class="meta">--bg</div></div>
        <div class="swatch" style="--color: var(--surface)"><div class="chip"></div><div class="meta">--surface</div></div>
        <div class="swatch" style="--color: var(--fg)"><div class="chip"></div><div class="meta">--fg</div></div>
        <div class="swatch" style="--color: var(--accent)"><div class="chip"></div><div class="meta">--accent</div></div>
        <div class="swatch" style="--color: var(--success)"><div class="chip"></div><div class="meta">--success</div></div>
        <div class="swatch" style="--color: var(--danger)"><div class="chip"></div><div class="meta">--danger</div></div>
      </section>
    </main>
  </body>
</html>
