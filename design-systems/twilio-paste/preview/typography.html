<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Twilio Paste Typography</title>
    <style>
/* Open Design schema tokens for Twilio Paste-inspired product UI. */

:root {
  --bg: #ffffff;
  --surface: #f9f9fa;
  --surface-warm: #f4f9ff;
  --fg: #121c2d;
  --fg-2: #394762;
  --muted: #606b85;
  --meta: #8b93aa;
  --border: #8b93aa;
  --border-soft: #e1e3ea;
  --accent: #006dfa;
  --accent-on: #ffffff;
  --accent-hover: #0263e0;
  --accent-active: #001489;
  --success: #14b053;
  --warn: #f47c22;
  --danger: #c72323;
  --font-display: "TwilioSansDisplay", "Inter var", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-body: "TwilioSansText", "Inter var", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "TwilioSansMono", Courier, monospace;
  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-lg: 18px;
  --text-xl: 20px;
  --text-2xl: 24px;
  --text-3xl: 32px;
  --text-4xl: 48px;
  --leading-body: 1.5;
  --leading-tight: 1.22;
  --tracking-display: 0em;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --section-y-desktop: 80px;
  --section-y-tablet: 56px;
  --section-y-phone: 36px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-pill: 9999px;
  --elev-flat: none;
  --elev-ring: 0 0 0 1px var(--border-soft);
  --elev-raised: 0 2px 8px rgba(18, 28, 45, 0.1);
  --focus-ring: 0 0 0 2px #ffffff, 0 0 0 4px var(--accent), 0 0 0 6px #cce4ff;
  --motion-fast: 120ms;
  --motion-base: 180ms;
  --ease-standard: cubic-bezier(0.23, 1, 0.32, 1);
  --container-max: 1180px;
  --container-gutter-desktop: 32px;
  --container-gutter-tablet: 24px;
  --container-gutter-phone: 16px;
}

      body { margin: 0; background: var(--bg); color: var(--fg); font: var(--text-base, 14px)/var(--leading-body, 1.5) var(--font-body, system-ui, sans-serif); }
      main { max-width: 860px; margin: 0 auto; padding: var(--space-12, 48px) var(--space-6, 24px); }
      .sample { padding: var(--space-4, 16px) 0; border-bottom: 1px solid var(--border-soft, #e5e5e5); }
      .name { color: var(--muted); font-size: var(--text-sm, 12px); margin-bottom: var(--space-2, 8px); }
      .display { font: 600 var(--text-3xl, 28px)/var(--leading-tight, 1.15) var(--font-display, inherit); letter-spacing: var(--tracking-display, 0); }
      .body { color: var(--fg-2, var(--fg)); }
      .small { font-size: var(--text-sm, 12px); color: var(--muted); }
      .code { font-family: var(--font-mono, monospace); font-size: var(--text-sm, 12px); }
    </style>
  </head>
  <body>
    <main>
      <section class="sample"><div class="name">Display</div><div class="display">Twilio Paste</div></section>
      <section class="sample"><div class="name">Body</div><div class="body">Captured design systems should stay readable, reusable, and faithful to the source evidence.</div></section>
      <section class="sample"><div class="name">Small UI</div><div class="small">Metadata, labels, counters, and quiet supporting text.</div></section>
      <section class="sample"><div class="name">Code</div><div class="code">--accent: var(--accent);</div></section>
    </main>
  </body>
</html>
