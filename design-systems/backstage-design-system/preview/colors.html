<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Backstage Colors</title>
    <style>
/* Open Design tokens for a Backstage-inspired developer portal system.
 * Derived from public Backstage docs, the Backstage repository, and Spotify for Backstage site evidence. */

:root {
  --bg: #0c0c0c;
  --surface: #121212;
  --surface-warm: #1b1f24;
  --fg: #ffffff;
  --fg-2: #f2f7f6;
  --muted: #aaadb0;
  --meta: #8f8f8f;
  --border: #2b3035;
  --border-soft: rgba(255, 255, 255, 0.1);
  --accent: #9bf0e1;
  --accent-on: #000000;
  --accent-hover: #7df3e1;
  --accent-active: #69ddc7;
  --success: #1ad760;
  --warn: #ffc862;
  --danger: #ea384c;
  --font-display: "SpotifyMix", "Inter", "Helvetica Neue", Arial, sans-serif;
  --font-body: "SpotifyMix", "Inter", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "SF Mono", "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-lg: 20px;
  --text-xl: 28px;
  --text-2xl: 40px;
  --text-3xl: 56px;
  --text-4xl: 76px;
  --leading-body: 1.5;
  --leading-tight: 1.02;
  --tracking-display: normal;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --section-y-desktop: 96px;
  --section-y-tablet: 72px;
  --section-y-phone: 44px;
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 28px;
  --radius-pill: 9999px;
  --elev-flat: none;
  --elev-ring: 0 0 0 1px var(--border);
  --elev-raised: 0 24px 70px rgba(0, 0, 0, 0.42);
  --focus-ring: 0 0 0 3px rgba(155, 240, 225, 0.36);
  --motion-fast: 150ms;
  --motion-base: 240ms;
  --ease-standard: cubic-bezier(0.23, 1, 0.32, 1);
  --container-max: 1240px;
  --container-gutter-desktop: 32px;
  --container-gutter-tablet: 24px;
  --container-gutter-phone: 16px;
}

      body { margin: 0; background: var(--bg); color: var(--fg); font: var(--text-base, 14px)/var(--leading-body, 1.5) var(--font-body, system-ui, sans-serif); }
      main { max-width: 920px; margin: 0 auto; padding: var(--space-12, 48px) var(--space-6, 24px); }
      h1 { margin: 0 0 var(--space-6, 24px); font-size: var(--text-3xl, 28px); line-height: var(--leading-tight, 1.15); }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-3, 12px); }
      .swatch { border: 1px solid var(--border-soft, #e5e5e5); border-radius: var(--radius-md, 8px); background: var(--surface, #fff); overflow: hidden; }
      .chip { height: 84px; background: var(--color); }
      .meta { padding: var(--space-3, 12px); color: var(--muted, #666); font-family: var(--font-mono, monospace); font-size: var(--text-sm, 12px); }
    </style>
  </head>
  <body>
    <main>
      <h1>Backstage color roles</h1>
      <section class="grid" aria-label="Color swatches">
        <div class="swatch" style="--color: var(--bg)"><div class="chip"></div><div class="meta">--bg</div></div>
        <div class="swatch" style="--color: var(--surface)"><div class="chip"></div><div class="meta">--surface</div></div>
        <div class="swatch" style="--color: var(--fg)"><div class="chip"></div><div class="meta">--fg</div></div>
        <div class="swatch" style="--color: var(--accent)"><div class="chip"></div><div class="meta">--accent</div></div>
        <div class="swatch" style="--color: var(--success)"><div class="chip"></div><div class="meta">--success</div></div>
        <div class="swatch" style="--color: var(--danger)"><div class="chip"></div><div class="meta">--danger</div></div>
      </section>
    </main>
  </body>
</html>
