<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex App Typography</title>
    <style>
      :root {
        --bg: #fbfbf8;
        --surface: #ffffff;
        --surface-warm: #f4f5f3;
        --fg: #1f2328;
        --fg-2: #3f454c;
        --muted: #6b727c;
        --meta: #9aa1ab;
        --border: #d8dee8;
        --border-soft: #e8edf5;
        --accent: #2f6feb;
        --accent-on: #ffffff;
        --accent-hover: #245dc8;
        --accent-active: #1f4fb0;
        --success: #1a7f37;
        --warn: #bf8700;
        --danger: #cf222e;
        --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        --font-mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
        --text-xs: 11px;
        --text-sm: 12px;
        --text-base: 13px;
        --text-lg: 14px;
        --text-xl: 16px;
        --text-2xl: 20px;
        --text-3xl: 28px;
        --text-4xl: 36px;
        --leading-body: 1.55;
        --leading-tight: 1.18;
        --tracking-display: 0;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --space-8: 32px;
        --space-12: 48px;
        --section-y-desktop: 48px;
        --section-y-tablet: 40px;
        --section-y-phone: 28px;
        --radius-sm: 6px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --radius-pill: 9999px;
        --elev-flat: none;
        --elev-ring: 0 0 0 1px var(--border);
        --elev-raised: 0 16px 40px rgba(31, 35, 40, 0.08);
        --focus-ring: 0 0 0 3px rgba(47, 111, 235, 0.18);
        --motion-fast: 140ms;
        --motion-base: 200ms;
        --ease-standard: cubic-bezier(0.23, 1, 0.32, 1);
        --container-max: 1180px;
        --container-gutter-desktop: 32px;
        --container-gutter-tablet: 24px;
        --container-gutter-phone: 16px;
      }
      body { margin: 0; background: var(--bg); color: var(--fg); font: var(--text-base)/var(--leading-body) var(--font-body); }
      main { max-width: 860px; margin: 0 auto; padding: var(--space-12) var(--space-6); }
      .sample { padding: var(--space-4) 0; border-bottom: 1px solid var(--border-soft); }
      .name { color: var(--muted); font-size: var(--text-xs); font-weight: 500; margin-bottom: var(--space-2); }
      .window { font-size: var(--text-lg); font-weight: 600; line-height: var(--leading-tight); }
      .body { font-size: var(--text-base); color: var(--fg-2); }
      .small { font-size: var(--text-sm); color: var(--muted); }
      .code { font-family: var(--font-mono); font-size: var(--text-sm); color: var(--fg); }
    </style>
  </head>
  <body>
    <main>
      <section class="sample"><div class="name">Window title</div><div class="window">Redesign app modern UI</div></section>
      <section class="sample"><div class="name">Body</div><div class="body">The agent completed the interface update and left the review pane open for inspection.</div></section>
      <section class="sample"><div class="name">Small UI</div><div class="small">4 files changed · worked for 40m 40s</div></section>
      <section class="sample"><div class="name">Code</div><div class="code">+ &lt;aside class="review-pane"&gt;</div></section>
    </main>
  </body>
</html>
