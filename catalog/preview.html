      assetGrid.textContent = "";
      for (const asset of visible) assetGrid.appendChild(card(asset));
      resultCount.textContent = visible.length + " shown · " + filtered.length + " matching · " + ASSETS.length + " total";
      activeFilters.textContent = filterSummary();
      empty.hidden = filtered.length !== 0;
      loadMore.hidden = visible.length >= filtered.length;
      const remaining = Math.max(0, filtered.length - visible.length);
      loadMore.textContent = "Load " + Math.min(PAGE_SIZE, remaining) + " more";
      if (selectedAssetId && !filtered.some((asset) => asset.id === selectedAssetId)) closeDrawer();
    }

    function resetWindowAndRender() {
      visibleLimit = PAGE_SIZE;
      render();
    }

    function setView(value) {
      document.body.dataset.view = value;
      galleryView.setAttribute("aria-pressed", String(value === "gallery"));
      listView.setAttribute("aria-pressed", String(value === "list"));
      writePreference("od-library-view", value);
    }

    function initializeOptions() {
      for (const value of [...new Set(ASSETS.map((asset) => asset.libraryId).filter(Boolean))].sort()) {
        const option = document.createElement("option"); option.value = value; option.textContent = value; library.appendChild(option);
      }
      for (const value of [...new Set(ASSETS.map((asset) => asset.status).filter(Boolean))].sort()) {
        const option = document.createElement("option"); option.value = value; option.textContent = value; status.appendChild(option);
      }
    }

    for (const button of kindButtons) button.addEventListener("click", () => {
      selectedKind = button.dataset.kind || "";
      for (const item of kindButtons) item.setAttribute("aria-pressed", String(item === button));
      resetWindowAndRender();
    });
    for (const button of scopeButtons) button.addEventListener("click", () => {
      selectedScope = selectedScope === button.dataset.previewScope ? "" : button.dataset.previewScope;
      for (const item of scopeButtons) item.setAttribute("aria-pressed", String(item.dataset.previewScope === selectedScope));
      resetWindowAndRender();
    });
    reviewButton.addEventListener("click", () => { reviewOnly = !reviewOnly; reviewButton.setAttribute("aria-pressed", String(reviewOnly)); resetWindowAndRender(); });
    search.addEventListener("input", resetWindowAndRender);
    library.addEventListener("change", resetWindowAndRender);
    status.addEventListener("change", resetWindowAndRender);
    sort.addEventListener("change", resetWindowAndRender);
    density.addEventListener("change", () => { document.body.dataset.density = density.value; writePreference("od-library-density", density.value); });
    loadMore.addEventListener("click", () => { visibleLimit += PAGE_SIZE; render(); });
    clearFilters.addEventListener("click", () => {
      selectedKind = ""; selectedScope = ""; reviewOnly = false; search.value = ""; library.value = ""; status.value = ""; sort.value = "catalog";
      for (const item of kindButtons) item.setAttribute("aria-pressed", String(item.dataset.kind === ""));
      for (const item of scopeButtons) item.setAttribute("aria-pressed", "false");
      reviewButton.setAttribute("aria-pressed", "false");
      resetWindowAndRender();
    });
    galleryView.addEventListener("click", () => setView("gallery"));
    listView.addEventListener("click", () => setView("list"));
    closeDrawerButton.addEventListener("click", closeDrawer);
    copyPath.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(copyPath.dataset.path || ""); copyPath.textContent = "Copied"; }
      catch { copyPath.textContent = "Copy failed"; }
    });
    openLargePreview.addEventListener("click", async () => {
      const previewPath = openLargePreview.dataset.previewPath;
      if (!previewPath) return;
      largePreviewTrigger = openLargePreview;
      dialogBody.textContent = "";
      const frame = document.createElement("iframe");
      frame.title = (openLargePreview.dataset.title || "Asset") + " interactive preview";
      frame.sandbox = "allow-scripts";
      dialogBody.appendChild(frame);
      dialogTitle.textContent = openLargePreview.dataset.title || "Large preview";
      previewDialog.showModal();
      const previewUrl = new URL("../" + previewPath, window.location.href);
      try {
        const response = await fetch(previewUrl);
        if (!response.ok) throw new Error("preview request failed");
        const source = await response.text();
        if (frame.isConnected) frame.srcdoc = prepareSandboxedPreviewHtml(source, new URL(".", previewUrl).href);
      } catch {
        if (frame.isConnected) frame.src = previewUrl.href;
      }
    });
    function closeLargePreview() { previewDialog.close(); }
    closeDialogButton.addEventListener("click", closeLargePreview);
    previewDialog.addEventListener("close", () => { dialogBody.textContent = ""; if (largePreviewTrigger) largePreviewTrigger.focus(); });
    previewDialog.addEventListener("click", (event) => { if (event.target === previewDialog) closeLargePreview(); });
    document.addEventListener("keydown", (event) => { if (event.key === "Escape" && !previewDialog.open && !drawer.hidden) closeDrawer(); });

    initializeOptions();
    const initialView = readPreference("od-library-view", "gallery");
    const initialDensity = readPreference("od-library-density", "comfortable");
    setView(initialView === "list" ? "list" : "gallery");
    density.value = initialDensity === "compact" ? "compact" : "comfortable";
    document.body.dataset.density = density.value;
    render();
  </script>
</body>
</html>
