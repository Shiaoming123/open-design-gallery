<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open Design Asset Library</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f2f3f3;
      --panel: #ffffff;
      --panel-soft: #fafafa;
      --ink: #202124;
      --muted: #71757a;
      --line: #d8dadd;
      --line-strong: #b9bdc2;
      --accent: #5b4ee8;
      --accent-soft: #efedff;
      --success: #267a3a;
      --warning: #7a5700;
      --warning-soft: #fff1bd;
      --shadow: 0 18px 50px rgb(25 28 33 / .16);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    button, input, select, summary { font: inherit; }
    button, select, summary { cursor: pointer; }
    body {
      margin: 0;
      min-width: 320px;
      overflow-x: hidden;
      background: var(--page);
      color: var(--ink);
      font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select, a, summary { outline-offset: 3px; }
    :focus-visible { outline: 2px solid var(--accent); }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      min-height: 58px;
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(240px, 460px) auto;
      gap: 14px;
      align-items: center;
      padding: 9px 16px;
      border-bottom: 1px solid var(--line);
      background: rgb(255 255 255 / .94);
      backdrop-filter: blur(14px);
    }
    .brand { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
    .brand strong { white-space: nowrap; font-size: 15px; }
    .brand span { color: var(--muted); font-size: 12px; }
    .search-wrap { position: relative; }
    .search-wrap label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .search-wrap input {
      width: 100%;
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--panel);
      color: var(--ink);
    }
    .view-controls { display: flex; gap: 6px; align-items: center; }
    .icon-button, .facet-button, .plain-button, .load-button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
    }
    .icon-button { min-height: 34px; padding: 0 10px; border-radius: 8px; font-size: 12px; }
    .icon-button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .workbench { display: grid; grid-template-columns: 190px minmax(0, 1fr); min-height: calc(100vh - 58px); }
    .sidebar {
      position: sticky;
      top: 58px;
      align-self: start;
      height: calc(100vh - 58px);
      overflow: auto;
      padding: 14px 10px;
      border-right: 1px solid var(--line);
      background: var(--panel-soft);
    }
    .facet-group { display: grid; gap: 3px; margin-bottom: 16px; }
    .facet-group h2 { margin: 7px 8px 5px; color: var(--muted); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
    .facet-button {
      min-height: 34px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-color: transparent;
      border-radius: 7px;
      background: transparent;
      text-align: left;
      font-size: 12px;
    }
    .facet-button[aria-pressed="true"] { background: #e4e6e7; color: var(--ink); font-weight: 700; }
    .facet-button span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
    .content { min-width: 0; padding: 15px 16px 40px; }
    .toolbar {
      display: grid;
      grid-template-columns: repeat(3, minmax(130px, 190px)) auto minmax(130px, 1fr);
      gap: 8px;
      align-items: end;
      margin-bottom: 10px;
    }
    .field { display: grid; gap: 4px; min-width: 0; }
    .field label { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .field select {
      width: 100%;
      min-height: 36px;
      padding: 0 30px 0 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
    }
    .plain-button { min-height: 36px; padding: 0 11px; border-radius: 8px; }
    .result-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 32px; margin-bottom: 10px; color: var(--muted); font-size: 12px; }
    #result-count { color: var(--ink); font-weight: 700; }
    #active-filters:empty { display: none; }
    #active-filters { padding: 3px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
    .asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; align-items: start; }
    .asset-card { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
    .asset-card:has(.card-select[aria-pressed="true"]) { border-color: var(--accent); box-shadow: 0 0 0 2px rgb(91 78 232 / .18); }
    .card-select { width: 100%; display: grid; padding: 0; border: 0; background: transparent; color: inherit; text-align: left; }
    .visual { position: relative; overflow: hidden; aspect-ratio: 4 / 3; background: #e8e9e9; border-bottom: 1px solid var(--line); }
    .visual img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .visual-empty { width: 100%; height: 100%; display: grid; place-items: center; padding: 18px; color: var(--muted); text-align: center; }
    .scope-badge { position: absolute; left: 7px; bottom: 7px; padding: 3px 6px; border-radius: 5px; background: var(--warning-soft); color: var(--warning); font-size: 10px; font-weight: 750; }
    .card-copy { min-width: 0; display: grid; gap: 2px; padding: 9px 10px 10px; }
    .card-title { overflow: hidden; margin: 0; font-size: 14px; line-height: 1.3; text-overflow: ellipsis; white-space: nowrap; }
    .card-kind { color: var(--muted); font-size: 11px; }
    body[data-density="compact"] .asset-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 7px; }
    body[data-density="compact"] .card-copy { padding: 6px 7px 7px; }
    body[data-view="list"] .asset-grid { grid-template-columns: 1fr; }
    body[data-view="list"] .card-select { grid-template-columns: 150px minmax(0, 1fr); align-items: center; }
    body[data-view="list"] .visual { aspect-ratio: 16 / 9; border-right: 1px solid var(--line); border-bottom: 0; }
    body[data-view="list"] .card-title { white-space: normal; }
    .empty { padding: 48px 18px; border: 1px dashed var(--line-strong); border-radius: 10px; background: var(--panel); color: var(--muted); text-align: center; }
    .load-row { display: flex; justify-content: center; padding-top: 16px; }
    .load-button { min-height: 38px; padding: 0 15px; border-radius: 8px; }
    .drawer {
      position: fixed;
      z-index: 30;
      top: 58px;
      right: 0;
      bottom: 0;
      width: clamp(400px, 34vw, 520px);
      overflow: auto;
      padding: 15px;
      border-left: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .drawer-header { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
    .drawer-header h2 { min-width: 0; overflow: hidden; margin: 0; font-size: 18px; text-overflow: ellipsis; white-space: nowrap; }
    .drawer-header button { margin-left: auto; }
    .drawer-preview { overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: #f5f5f4; }
    .drawer-preview-visual { position: relative; }
    .drawer-preview img { width: 100%; aspect-ratio: 16 / 10; object-fit: contain; display: block; }
    .drawer-actions { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 7px; margin: 11px 0; }
    .drawer-actions button, .drawer-actions a { min-height: 38px; display: inline-flex; align-items: center; justify-content: center; padding: 0 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); text-decoration: none; }
    .drawer-actions .primary { border-color: #242424; background: #242424; color: white; font-weight: 700; }
    .metadata { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .metadata summary { display: flex; align-items: center; gap: 7px; min-height: 44px; list-style: none; font-weight: 700; }
    .metadata summary::-webkit-details-marker { display: none; }
    .metadata summary span { color: var(--muted); font-size: 11px; font-weight: 500; }
    .metadata summary::after { content: "+"; margin-left: auto; color: var(--muted); }
    .metadata[open] summary::after { content: "−"; }
    .metadata dl { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 7px 10px; margin: 0; padding: 2px 0 14px; font-size: 12px; }
    .metadata dt { color: var(--muted); font-weight: 700; }
    .metadata dd { min-width: 0; margin: 0; overflow-wrap: anywhere; }
    dialog { width: min(1180px, calc(100vw - 32px)); height: min(820px, calc(100vh - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); }
    dialog::backdrop { background: rgb(20 22 26 / .72); }
    .dialog-shell { height: 100%; display: grid; grid-template-rows: 50px minmax(0, 1fr); }
    .dialog-header { display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--line); }
    .dialog-header strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dialog-header button { margin-left: auto; }
    .dialog-body { min-height: 0; }
    .dialog-body iframe { width: 100%; height: 100%; display: block; border: 0; }
    @media (max-width: 980px) {
      .toolbar { grid-template-columns: repeat(2, minmax(130px, 1fr)); }
      .toolbar .plain-button { align-self: end; }
    }
    @media (max-width: 800px) {
      .topbar { position: relative; grid-template-columns: 1fr auto; gap: 8px; }
      .search-wrap { grid-column: 1 / -1; grid-row: 2; }
      .workbench { display: block; min-height: 0; }
      .sidebar { position: relative; top: auto; height: auto; display: flex; gap: 10px; overflow-x: auto; padding: 8px 10px; border-right: 0; border-bottom: 1px solid var(--line); }
      .facet-group { flex: 0 0 auto; display: flex; gap: 4px; margin: 0; }
      .facet-group h2 { display: none; }
      .facet-button { min-height: 32px; padding: 5px 7px; border-color: var(--line); background: var(--panel); white-space: nowrap; }
      .content { padding: 10px 10px 32px; }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .drawer { top: auto; left: 0; width: 100%; height: min(74vh, 680px); border-top: 1px solid var(--line); border-left: 0; border-radius: 14px 14px 0 0; }
      .drawer-preview img { max-height: 34vh; }
    }
    @media (max-width: 520px) {
      .brand span { display: none; }
      .view-controls .icon-button { padding: 0 8px; }
      .toolbar { grid-template-columns: 1fr; }
      .asset-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
      body[data-density="compact"] .asset-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .card-title { font-size: 12px; }
      .drawer-actions { grid-template-columns: 1fr auto; }
      .drawer-actions .source-link { grid-column: 1 / -1; }
    }
  </style>
</head>
<body data-view="gallery" data-density="comfortable">
  <header class="topbar">
    <div class="brand"><strong>Open Design Library</strong><span>447 assets</span></div>
    <div class="search-wrap">
      <label for="search">Search assets</label>
      <input id="search" type="search" placeholder="Search titles, tags, roles, paths..." autocomplete="off" />
    </div>
    <div class="view-controls" aria-label="View controls">
      <button class="icon-button" id="gallery-view" type="button" aria-pressed="true">Gallery</button>
      <button class="icon-button" id="list-view" type="button" aria-pressed="false">List</button>
    </div>
  </header>

  <div class="workbench">
    <aside class="sidebar" aria-label="Asset facets">
      <section class="facet-group" aria-labelledby="type-label">
        <h2 id="type-label">Library</h2>
        <button class="facet-button" type="button" data-kind="" aria-pressed="true"><span>All assets</span><span>447</span></button>
        <button class="facet-button" type="button" data-kind="design-system" aria-pressed="false"><span>Systems</span><span>172</span></button>
        <button class="facet-button" type="button" data-kind="design-template" aria-pressed="false"><span>Templates</span><span>159</span></button>
        <button class="facet-button" type="button" data-kind="case-study" aria-pressed="false"><span>Case studies</span><span>116</span></button>
      </section>
      <section class="facet-group" aria-labelledby="preview-label">
        <h2 id="preview-label">Preview health</h2>
        <button class="facet-button" type="button" data-preview-scope="asset" aria-pressed="false"><span>Asset preview</span><span>321</span></button>
        <button class="facet-button" type="button" data-preview-scope="collection" aria-pressed="false"><span>Collection</span><span>10</span></button>
        <button class="facet-button" type="button" data-preview-scope="shared-collection" aria-pressed="false"><span>Shared case</span><span>116</span></button>
        <button class="facet-button" type="button" data-preview-scope="none" aria-pressed="false"><span>Unavailable</span><span>0</span></button>
        <button class="facet-button" type="button" data-review="true" aria-pressed="false"><span>Need review</span><span>3</span></button>
      </section>
    </aside>

    <main class="content">
      <section class="toolbar" aria-label="Browse controls">
        <div class="field"><label for="library">Library</label><select id="library"><option value="">All libraries</option></select></div>
        <div class="field"><label for="status">Status</label><select id="status"><option value="">All statuses</option></select></div>
        <div class="field"><label for="sort">Sort</label><select id="sort"><option value="catalog">Catalog order</option><option value="title">Title A–Z</option><option value="kind">Asset type</option><option value="status">Status</option></select></div>
        <div class="field"><label for="density">Density</label><select id="density"><option value="comfortable">Comfortable</option><option value="compact">Compact</option></select></div>
        <button class="plain-button" id="clear-filters" type="button">Clear filters</button>
      </section>
      <div class="result-bar"><span id="result-count" aria-live="polite"></span><span id="active-filters"></span></div>
      <section id="asset-grid" class="asset-grid" aria-label="Asset results"></section>
      <div id="empty" class="empty" hidden>No assets match the current filters.</div>
      <div class="load-row"><button id="load-more" class="load-button" type="button">Load more</button></div>
    </main>
  </div>

  <aside id="preview-drawer" class="drawer" aria-labelledby="drawer-title" hidden>
    <div class="drawer-header"><h2 id="drawer-title">Asset preview</h2><button id="close-drawer" class="icon-button" type="button" aria-label="Close asset preview">Close</button></div>
    <div id="drawer-preview" class="drawer-preview"></div>
    <div class="drawer-actions">
      <button id="open-large-preview" class="primary" type="button">Open large preview</button>
      <button id="copy-path" type="button">Copy path</button>
      <a id="source-link" class="source-link" target="_blank" rel="noreferrer">Open source</a>
    </div>
    <details id="metadata-details" class="metadata">
      <summary>Metadata <span id="metadata-count"></span></summary>
      <dl id="metadata-list"></dl>
    </details>
  </aside>

  <dialog id="preview-dialog" aria-labelledby="dialog-title">
    <div class="dialog-shell">
      <div class="dialog-header"><strong id="dialog-title">Large preview</strong><button id="close-dialog" class="icon-button" type="button">Close</button></div>
      <div id="dialog-body" class="dialog-body"></div>
    </div>
  </dialog>

d a deliberately self-aware voice so th…"],"visualTraits":["comedy-festival-campaign-visual-system","Netflix Is a Joke: The Festival","PORTO ROCHA for Netflix","https://www.portorocha.com/netflixisajoke/","festival campaign identity and event visual system","Copy-led identity spanning promotional campaign, trailer, out-of-home takeovers, and main-stage graphics","2024 festival","display-typography","Campaign recognition and programme flexibility","The source identifies wood-type-inspired typography and Midnight Sans by Colophon; no type files or source artwork are included in this library.","License an appropriate typeface or use an original typographic treatment rather than reproducing the source's lettering.","dimensional-graphic-containers","Repeatable visual structure","The case describes dimensional containers as an identity component that supports copy and logo; the proprietary forms are not reproduced locally.","Create original geometric frames with an explicit depth and lighting rule when a campaign needs an adaptable supporting layer.","logo-announcement-trailer","Dimensionality becomes an announcement motion principle","Netflix and Panic Studio used the identity's dimensional element in a trailer that brings the logo to life.","Keep the wordmark and campaign copy fully legible in a still frame; offer a static key visual or low-motion crossfade where animation is unavailable or unwanted."],"roles":["case-reference","campaign-visual-projects-reference","motion-patterns"],"sourcePolicy":"inspiration-only","libraryId":"campaign-visual-projects","status":"accepted","captureDepth":"case-study","sourceUrls":["https://www.portorocha.com/netflixisajoke"],"sourceUrlHashes":["3b2043bc5c3c3a43"],"files":{"catalog":"design-templates/campaign-visual-projects/references/catalog.json","source":"design-templates/campaign-visual-projects/references/entries/netflix-is-a-joke-festival-campaign.json","preview":"design-templates/campaign-visual-projects/example.html"},"previewScope":"shared-collection"},{"id":"campaign-visual-projects:nike-art-of-victory-centre-pompidou-campaign","kind":"case-study","title":"Nike au Centre Pompidou","summary":"A strong campaign-visual reference because the case study shows how one promotional system can stay unmistakably Nike while flexing from tiny event touchpoints to the largest screen in Europe. The system couples compressed display type, a tight orange-and-Vol…","sourcePath":"design-templates/campaign-visual-projects/references/entries/nike-art-of-victory-centre-pompidou-campaign.json","previewPath":"design-templates/campaign-visual-projects/example.html","tags":["campaign-visual-projects","olympic-brand-campaign-visual-system","campaign-visual-system","2024 Olympics-era exhibition and brand campaign spanning social assets, signage, posters, merch, and façade-scale motion","artifact-study"],"useCases":["campaign visual projects","olympic-brand-campaign-visual-system","campaign-visual-system"],"userWords":["A strong campaign-visual reference because the case study shows how one promotional system can stay unmistakably Nike while flexing from tiny event touchpoints to the largest screen in Europe. The system couples compressed display type, a tight orange-and-Vol…"],"visualTraits":["olympic-brand-campaign-visual-system","Nike au Centre Pompidou","PORTO ROCHA for Nike","https://www.portorocha.com/nikepompidou","campaign-visual-system","2024 Olympics-era exhibition and brand campaign spanning social assets, signage, posters, merch, and façade-scale motion","modified-house-type","Primary campaign voice","Nike's house typography is stretched and condensed into bolder poster-like expressions instead of being replaced outright.","Escalate the existing type system before inventing a detached event face.","dual-accent-palette","Recognition plus novelty","Orange remains the anchor while Volt green supplies short-term campaign energy.","Keep palette decisions extremely narrow when the campaign already has strong type and imagery.","hero-photography","Instant athlete recognition","Direct portraits and customized AI-generated shoes create blunt hero frames that survive from social to architecture.","Favor frontal portraits when distance and speed of reading matter more than narrative scene-building.","campaign-pattern","Graphic continuity","The Electric Print motif creates one shared textural thread between product, motion, and environmental materials.","Carry one recognizable texture across the entire rollout to reduce the number of visual variables each format needs.","large-scale-loop","Architectural motion as the headline expression"],"roles":["case-reference","campaign-visual-projects-reference","motion-patterns"],"sourcePolicy":"inspiration-only","libraryId":"campaign-visual-projects","status":"accepted","captureDepth":"artifact-study","sourceUrls":["https://www.portorocha.com/nikepompidou"],"sourceUrlHashes":["f807f0e1c3286657"],"files":{"catalog":"design-templates/campaign-visual-projects/references/catalog.json","source":"design-templates/campaign-visual-projects/references/entries/nike-art-of-victory-centre-pompidou-campaign.json","preview":"design-templates/campaign-visual-projects/example.html"},"previewScope":"shared-collection"},{"id":"campaign-visual-projects:notion-think-it-make-it-brand-campaign","kind":"case-study","title":"Think it. Make it.","summary":"A strong campaign-visual reference because it shows how a famously minimal software brand can temporarily widen its visual language for public media without losing recognition. The system keeps Notion's illustration DNA, then adds close-profile crops, primary…","sourcePath":"design-templates/campaign-visual-projects/references/entries/notion-think-it-make-it-brand-campaign.json","previewPath":"design-templates/campaign-visual-projects/example.html","tags":["campaign-visual-projects","saas-brand-awareness-campaign-visual-system","campaign-visual-system","2024 global brand-awareness campaign spanning OOH, transit placements, social crops, and an animated anthem","artifact-study"],"useCases":["campaign visual projects","saas-brand-awareness-campaign-visual-system","campaign-visual-system"],"userWords":["A strong campaign-visual reference because it shows how a famously minimal software brand can temporarily widen its visual language for public media without losing recognition. The system keeps Notion's illustration DNA, then adds close-profile crops, primary…"],"visualTraits":["saas-brand-awareness-campaign-visual-system","Think it. Make it.","BUCK with Notion","https://buck.co/work/notion-think-it-make-it","campaign-visual-system","2024 global brand-awareness campaign spanning OOH, transit placements, social crops, and an animated anthem","bespoke-headline-copy","Message compression","A short master tagline plus tailored sub-headlines turns a flexible product story into public-facing copy that reads quickly.","Create one master imperative and derive concise variations instead of writing unrelated campaign headlines per channel.","close-crop-illustration","Recognition and emotional focus","Roman Muradov's illustrations remain the campaign's recognizability engine, but the tighter head-and-shoulders crops make them carry more emotional and narrative weight.","Keep the signature illustration author while changing framing before replacing the visual language entirely.","primary-color-palette","Attention in crowded environments","The system adds saturated yellow, blue, and red blocks to a previously monochrome brand so the work can compete in cities and transit systems.","Use a limited temporary palette as a campaign-only amplifier when the master brand is too quiet for OOH.","shape-block-framing","Graphic containment","Simple geometric color fields and framing blocks give the hand-drawn imagery enough structure to scale cleanly across placements.","Pair expressive illustration with blunt framing geometry so the campaign still reads as a system under heavy resizing and recropping.","anthem-film","Animated anthem translates the static grammar into motion"],"roles":["case-reference","campaign-visual-projects-reference","motion-patterns"],"sourcePolicy":"inspiration-only","libraryId":"campaign-visual-projects","status":"accepted","captureDepth":"artifact-study","sourceUrls":["https://buck.co/work/notion-think-it-make-it","https://www.notion.com/blog/the-thinking-behind-our-latest-brand-campaign"],"sourceUrlHashes":["636f584d18584c56","b0fb21aa1dc61c85"],"files":{"catalog":"design-templates/campaign-visual-projects/references/catalog.json","source":"design-templates/campaign-visual-projects/references/entries/notion-think-it-make-it-brand-campaign.json","preview":"design-templates/campaign-visual-projects/example.html"},"previewScope":"shared-collection"},{"id":"campaign-visual-projects:pepsi-crave-liquid-asset-campaign","kind":"case-study","title":"Pepsi \"Crave\"","summary":"A strong campaign-visual reference because the BUCK case is not just a polished one-off film. It documents a campaign system built from practical liquid shots, motion-control capture, and swappable pack assets that Pepsi teams could reuse across markets. That…","sourcePath":"design-templates/campaign-visual-projects/references/entries/pepsi-crave-liquid-asset-campaign.json","previewPath":"design-templates/campaign-visual-projects/example.html","tags":["campaign-visual-projects","beverage-brand-campaign-asset-system","campaign-visual-system","Global beverage campaign centered on a 30-second hero film and a reusable liquid-footage asset library for regional content","artifact-study"],"useCases":["campaign visual projects","beverage-brand-campaign-asset-system","campaign-visual-system"],"userWords":["A strong campaign-visual reference because the BUCK case is not just a polished one-off film. It documents a campaign system built from practical liquid shots, motion-control capture, and swappable pack assets that Pepsi teams could reuse across markets. That…"],"visualTraits":["beverage-brand-campaign-asset-system","Pepsi \"Crave\"","BUCK for Pepsi","https://buck.co/work/pepsi-crave","campaign-visual-system","Global beverage campaign centered on a 30-second hero film and a reusable liquid-footage asset library for regional content","high-speed-liquid-footage","Sensory hero material","Custom-shot liquid footage provides the campaign's core emotional and visual payoff, functioning as both a cinematic centerpiece and modular raw material.","Invest in a few unforgettable physical captures when the product's appeal depends on texture, force, or refreshment.","logo-swappable-packshots","Regional adaptation layer","Pack shots are built to support logo replacement while maintaining consistent ice, condensation, and appetite cues.","Separate product realism from market-specific branding so the same campaign base can travel globally.","ice-condensation-finish","Credibility and appetite signal","The preserved wet surface treatment keeps every derivative asset feeling cold and tactile even after brand swapping and recropping.","Treat surface detail as a system requirement, not just a finishing flourish, when the campaign is selling refreshment.","slow-motion-impact","High-speed motion control turns refreshment into spectacle","The moving image language depends on slow-motion collisions, splashes, and propelled liquid events captured through specialized rigs and cameras.","If this level of production is unavailable, keep the same appetite logic through fewer but sharper practical shots instead of replacing everything with generic CG motion.","thirst-arc-editing","Motion follows a clear crave-to-satisfaction progression"],"roles":["case-reference","campaign-visual-projects-reference","motion-patterns"],"sourcePolicy":"inspiration-only","libraryId":"campaign-visual-projects","status":"accepted","captureDepth":"artifact-study","sourceUrls":["https://buck.co/work/pepsi-crave"],"sourceUrlHashes":["6f770e8f304aa3a8"],"files":{"catalog":"design-templates/campaign-visual-projects/references/catalog.json","source":"design-templates/campaign-visual-projects/references/entries/pepsi-crave-liquid-asset-campaign.json","preview":"design-templates/campaign-visual-projects/example.html"},"previewScope":"shared-collection"},{"id":"commercial-product-launches:apple-iphone-product-family","kind":"case-study","title":"Apple","summary":"A benchmark for product-family storytelling that moves from switching reassurance to durability, software, privacy, cameras, environment, safety, and purchase comparison.","sourcePath":"design-templates/commercial-product-launches/references/catalog.json","previewPath":"design-templates/commercial-product-launches/example.html","tags":["consumer hardware","product-family","commercial-launch"],"useCases":["product launch","marketing site","commerce","product-family"],"userWords":["A benchmark for product-family storytelling that moves from switching reassurance to durability, software, privacy, cameras, environment, safety, and purchase comparison."],"visualTraits":["consumer hardware","product-family"],"roles":["brand-reference","page-modules","media-direction","motion-patterns"],"sourcePolicy":"inspiration-only","libraryId":"commercial-product-launches","status":"accepted","captureDepth":"page-and-modules","sourceUrls":["https://www.apple.com/iphone"],"sourceUrlHashes":["60e82023e775681e"],"files":{"catalog":"design-templates/commercial-product-launches/references/catalog.json","preview":"design-templates/commercial-product-launches/example.html"},"previewScope":"shared-collection"},{"id":"commercial-product-launches:apple-vision-pro-spatial-computing-product-page","kind":"case-study","title":"Apple","summary":"A strong premium-product reference for selling a new computing category through comfort hardware, immersive use-case chapters, demo booking, and support-heavy commerce rather than a pure technical-spec pitch.","sourcePath":"design-templates/commercial-product-launches/references/catalog.
