d692480a","cafcfd776dce51a6"],"files":{"catalog":"design-templates/data-visualization-projects/references/catalog.json","source":"design-templates/data-visualization-projects/references/entries/owid-annual-co2-emissions.json","preview":"design-templates/data-visualization-projects/example.html"},"previewScope":"shared-collection"},{"id":"editorial-magazine-projects:brooklyn-rail-anthropophagy-issue-editorial-design","kind":"case-study","title":"Brooklyn Rail: Only Anthropophagy Unites Us?","summary":"A strong editorial-system reference because it translates political and literary context into a compact publication grammar: manifesto-inspired cover language, black-and-white newsprint pacing, concrete-poetry titling, and intentionally unstable image placeme…","sourcePath":"design-templates/editorial-magazine-projects/references/entries/brooklyn-rail-anthropophagy-issue-editorial-design.json","previewPath":"design-templates/editorial-magazine-projects/example.html","tags":["editorial-magazine-projects","bilingual-cultural-critics-issue","editorial-magazine","Guest-designed February 2021 bilingual Critics Page issue that turns manifesto-driven typography and black-and-white newsprint into the issue's editorial voice","artifact-study"],"useCases":["editorial magazine projects","bilingual-cultural-critics-issue","editorial-magazine"],"userWords":["A strong editorial-system reference because it translates political and literary context into a compact publication grammar: manifesto-inspired cover language, black-and-white newsprint pacing, concrete-poetry titling, and intentionally unstable image placeme…"],"visualTraits":["bilingual-cultural-critics-issue","Brooklyn Rail: Only Anthropophagy Unites Us?","PORTO ROCHA for The Brooklyn Rail","https://www.portorocha.com/brooklynrail","editorial-magazine","Guest-designed February 2021 bilingual Critics Page issue that turns manifesto-driven typography and black-and-white newsprint into the issue's editorial voice","manifesto-reference-cover","Cover language lifted from the source text's formal energy","PORTO ROCHA explicitly cites Oswald de Andrade's 1928 Manifesto Antropofago as the reference point for the issue's cover and interior spread language, so the publication's visual tone grows out of the essay tradition it is revisiting rather than from a detached decorative style.","When a publication revisits one founding text or movement, let the reference document shape cover and spread behavior so the issue's graphics feel argued rather than merely themed.","newsprint-monochrome-rhythm","Black-and-white newsprint sets the issue's baseline cadence","The interior holds to black-and-white layouts that embrace newsprint as a material condition, which keeps the issue grounded and lets typographic and spatial tension carry the drama instead of relying on added color spectacle.","Use a monochrome production limit as a pacing tool when an editorial object needs urgency, economy, and a sharper relationship between text, crop, and whitespace.","concrete-poetry-headline-system","Headline settings borrow the compression and instability of concrete poetry","The case study says the title treatments are inspired by concrete poetry, which lets headlines behave like visual interruptions rather than neutral labels and gives the issue a more argumentative reading rhythm.","Treat display type as a formal essay device when feature titles need to alter reading speed and emotional tone before body copy begins.","rule-breaking-image-placement","Images refuse full grid obedience to keep ideological friction visible","PORTO ROCHA describes rule-breaking image placements that add tension to the issue, suggesting a layout system that keeps small moments of instability in play instead of resolving every spread into a calm editorial template.","Break image-placement rules in a controlled way when a cultural or political issue should feel charged and unfinished rather than perfectly institutional.","type-family-system","Typographic bridge between manifesto voice and editorial clarity"],"roles":["case-reference","editorial-magazine-projects-reference"],"sourcePolicy":"inspiration-only","libraryId":"editorial-magazine-projects","status":"accepted","captureDepth":"artifact-study","sourceUrls":["https://www.portorocha.com/brooklynrail","https://brooklynrail.org/issues/2021-02"],"sourceUrlHashes":["89f1dd631d2ef8f1","1208e64ac28d6ec0"],"files":{"catalog":"design-templates/editorial-magazine-projects/references/catalog.json","source":"design-templates/editorial-magazine-projects/references/entries/brooklyn-rail-anthropophagy-issue-editorial-design.json","preview":"design-templates/editorial-magazine-projects/example.html"},"previewScope":"shared-collection"},{"id":"editorial-magazine-projects:circular-22-typographic-circle-publication-redesign","kind":"case-study","title":"Circular 22","summary":"A strong editorial-system reference because it uses production decisions as editorial voice: the smaller format, overprinted imagery, fluorescent accents, displaced frontmatter, and speaker-specific monograms make the publication feel collectible and experime…","sourcePath":"design-templates/editorial-magazine-projects/references/entries/circular-22-typographic-circle-publication-redesign.json","previewPath":"design-templates/editorial-magazine-projects/example.html","tags":["editorial-magazine-projects","experimental-typography-journal","editorial-magazine","A compact 2024 redesign of Typographic Circle's member publication that turns a smaller half-size format into a tactile, print-first editorial object","artifact-study"],"useCases":["editorial magazine projects","experimental-typography-journal","editorial-magazine"],"userWords":["A strong editorial-system reference because it uses production decisions as editorial voice: the smaller format, overprinted imagery, fluorescent accents, displaced frontmatter, and speaker-specific monograms make the publication feel collectible and experime…"],"visualTraits":["experimental-typography-journal","Circular 22","Pentagram / Domenic Lippa with Jim Sutherland and Louise Sloper for Typographic Circle","https://www.pentagram.com/work/circular-22","editorial-magazine","A compact 2024 redesign of Typographic Circle's member publication that turns a smaller half-size format into a tactile, print-first editorial object","portable-half-size-format","Smaller format used as a desirability move, not a downgrade","The redesign shifts the publication into a more portable half-size format, then compensates by raising print drama and material richness so the object feels more precious rather than reduced.","When editorial constraints force a smaller footprint, treat the format change as a chance to increase intimacy and collectibility instead of simply compressing the old layout.","overprinted-collage-spread","Layered image spreads that feel textured and slightly unresolved","Project imagery is overlapped across spreads so some layers remain partially hidden, creating a dense printed texture that unifies very different contributors without flattening their work into identical frames.","Use controlled overlap and partial occlusion when an editorial feature set needs cohesion but should still preserve friction, discovery, and the sense of a physical printed surface.","mid-book-frontmatter-reversal","Introduction and colophon repositioned deep into the sequence","The issue breaks expected magazine sequencing by moving the introduction and colophon roughly two-thirds into the publication, making the reader encounter the object more like a curated artifact than a standard linear periodical.","Relocate housekeeping content when a publication wants the opening stretch to feel immersive or intuitive before explanatory framing appears.","speaker-monogram-divider","Fluorescent monograms establish contributor-level rhythm","Large abstract monograms give each speaker or contributor a distinct marker, acting as navigational pauses while keeping the issue's visual language loud and print-centric.","Create one bold recurring divider device when a multi-contributor publication needs section changes that can be recognized instantly without relying on repeated template pages.","type-family-system","Tension between editorial structure and image play"],"roles":["case-reference","editorial-magazine-projects-reference"],"sourcePolicy":"inspiration-only","libraryId":"editorial-magazine-projects","status":"accepted","captureDepth":"artifact-study","sourceUrls":["https://www.pentagram.com/work/circular-22","https://www.pentagram.com/news?page=10"],"sourceUrlHashes":["641e349458e302e6","0ecb55ba4df2b0c7"],"files":{"catalog":"design-templates/editorial-magazine-projects/references/catalog.json","source":"design-templates/editorial-magazine-projects/references/entries/circular-22-typographic-circle-publication-redesign.json","preview":"design-templates/editorial-magazine-projects/example.html"},"previewScope":"shared-collection"},{"id":"editorial-magazine-projects:nothing-personal-editorial-platform","kind":"case-study","title":"Nothing Personal","summary":"A useful contemporary editorial reference because it treats the browser as part of the publication's visual language: the identity can feel like a magazine, a web page, and a conversation with internet culture at the same time.","sourcePath":"design-templates/editorial-magazine-projects/references/entries/nothing-personal-editorial-platform.json","previewPath":"design-templates/editorial-magazine-projects/example.html","tags":["editorial-magazine-projects","counterculture-editorial-platform","digital editorial platform and magazine identity","Responsive editorial site with feature stories, product reviews, advice, and podcast content","case-study"],"useCases":["editorial magazine projects","counterculture-editorial-platform","digital editorial platform and magazine identity"],"userWords":["A useful contemporary editorial reference because it treats the browser as part of the publication's visual language: the identity can feel like a magazine, a web page, and a conversation with internet culture at the same time."],"visualTraits":["counterculture-editorial-platform","Nothing Personal","Natasha Jen and team at Pentagram for Mozilla Foundation","https://www.mozillafoundation.org/en/nothing-personal/","digital editorial platform and magazine identity","Responsive editorial site with feature stories, product reviews, advice, and podcast content","2025 launch; Pentagram work published 2026","browser-window-frame","Web vernacular as editorial framing","https://www.itsnicethat.com/articles/mozilla-foundation-pentagram-graphic-design-project-131125","The credited case study describes a visual language borrowing from pop-ups, chat windows, and browser bars, treating interruption as part of the publication's human mark.","Turn familiar interface containers into editorial punctuation for stories about technology, culture, or the networked world.","overlay-mark","A mark that behaves, not just identifies","The NP. mark is described as deliberately simple and able to overlay imagery as both a window and a veil.","Design an editorial mark with placement behavior and an expressive relationship to imagery, rather than limiting it to the masthead.","cover-as-entry-point","Contrast creates the cover energy","The platform uses direct headlines, people-centered editorial subjects, and a strong contrast between content modes to establish a magazine-like front door.","Let the first screen establish editorial attitude through scale, contrast, and a single story signal before the archive becomes visible.","modular-color-blocks","section framing","The source case describes solid blocks and borders as compositional punctuation; this library recreates the principle with original CSS only.","Build a small set of shapes and borders that can frame stories, reviews, and calls to action without copying the source identity."],"roles":["case-reference","editorial-magazine-projects-reference"],"sourcePolicy":"inspiration-only","libraryId":"editorial-magazine-projects","status":"accepted","captureDepth":"case-study","sourceUrls":["https://www.mozillafoundation.org/en/nothing-personal","https://www.itsnicethat.com/articles/mozilla-foundation-pentagram-graphic-design-project-131125","https://www.pentagram.com/work/mozilla-foundation"],"sourceUrlHashes":["fdb227eaadcc29c4","bea1731788ee7a34","b38b5e026accd233"],"files":{"catalog":"design-templates/editorial-magazine-projects/references/catalog.json","source":"design-templates/editorial-magazine-projects/references/entries/nothing-personal-editorial-platform.json","preview":"design-templates/editorial-magazine-projects/example.html"},"previewScope":"shared-collection"},{"id":"editorial-magazine-projects:samba-brazilian-queer-culture-magazine","kind":"case-study","title":"Samba","summary":"A strong editorial-system reference because it balances raw community-driven photography with a tightly controlled cover and index logic. The project shows how one magazine can feel loud, intimate, and collectible at once by pairing a shelf-grabbing wraparoun…","sourcePath":"design-templates/editorial-magazine-projects/references/entries/samba-brazilian-queer-culture-magazine.json","previewPath":"design-templates/editorial-magazine-projects/example.html","tags":["editorial-magazine-projects","photo-led-cultural-magazine","editorial-magazine","Biannual publication celebrating Brazilian queer culture through fashion, portraiture, and long-form photographic stories","artifact-study"],"useCases":["editorial magazine projects","photo-led-cultural-magazine","editorial-magazine"],"userWords":["A strong editorial-system reference because it balances raw community-driven photography with a tightly controlled cover and index logic. The project shows how one magazine can feel loud, intimate, and collectible at once by pairing a shelf-grabbing wraparoun…"],"visualTraits":["photo-led-cultural-magazine","Samba","PORTO ROCHA for editor Juliano Corbetta","https://www.portorocha.com/samba","editorial-magazine","Biannual publication celebrating Brazilian queer culture through fashion, portraiture, and long-form photographic stories","wraparound-spine-cover","Vertical logo repeated across every edge","The logo is stacked vertically and allowed to wrap around the cover edges so the issue keeps announcing itself from the front, back, and spine rather than relying on one flat cover lockup.","Repeat one compact identity gesture around the object when a magazine needs strong shelf presence from multiple viewing angles.","dual-cover-identity","Opposing front-and-back portraits as one statement","The publication uses two contrasting cover portraits of the same subject to foreground duality before the reader opens the issue, turning the object itself into an argument about identity.","Use paired covers when an editorial project benefits from presenting two emotional registers without choosing one definitive hero image.","directory-index-bridge","Structured index interrupts the image flow","A strict index inspired by directory aesthetics cuts through the full-bleed photography, giving readers one moment of inventory and crediting before the issue returns to looser visual storytelling.","Insert one sharply structured directory spread when a photo-heavy issue needs a deliberate reset point and contributor map.","full-bleed-photo-rhythm","Mostly text-free photographic sequencing","Large uninterrupted image runs create a continuous emotional pace, with text held back so the magazine reads more like a sequence of encounters than a standard article package.","Let photography carry the pacing when the editorial goal is immersion and community portraiture rather than constant explanatory framing.","condensed-cover-wordmark","Shelf-level identity anchor"],"roles":["case-reference","editorial-magazine-projects-reference"],"sourcePolicy":"inspiration-only","libraryId":"editorial-magazine-projects","status":"accepted","captureDepth":"artifact-study","sourceUrls":["https://www.portorocha.com/samba"],"sourceUrlHashes":["8d9732f2d611d73f"],"files":{"catalog":"design-templates/editorial-magazine-projects/references/catalog.json","source":"design-templates/editorial-magazine-projects/references/entries/samba-brazilian-queer-culture-magazine.json","preview":"design-templates/editorial-magazine-projects/example.html"},"previewScope":"shared-collection"},{"id":"editorial-magazine-projects:the-baffler-editorial-redesign","kind":"case-study","title":"The Baffler","summary":"A strong editorial-system reference because the case page shows how one publication can feel democratic and unruly at the same time: the redesign uses an angular identity, typography-led sectioning, flexible opening spreads, and restrained color cues to keep…","sourcePath":"design-templates/editorial-magazine-projects/references/entries/the-baffler-editorial-redesign.json","previewPath":"design-templates/editorial-magazine-projects/example.html","tags":["editorial-magazine-projects","literary-journal-redesign","editorial-magazine","Editorial redesign for an ad-free quarterly literary journal with a companion website","artifact-study"],"useCases":["editorial magazine projects","literary-journal-redesign","editorial-magazine"],"userWords":["A strong editorial-system reference because the case page shows how one publication can feel democratic and unruly at the same time: the redesign uses an angular identity, typography-led sectioning, flexible opening spreads, and restrained color cues to keep…"],"visualTraits":["literary-journal-redesign","The Baffler","Pentagram / Eddie Opara for The Baffler","https://www.pentagram.com/work/the-baffler","editorial-magazine","Editorial redesign for an ad-free quarterly literary journal with a companion website","corner-lockup-cover","Angular logo used as a framing device","The redesigned logo is treated as an all-angle lockup that can sit in a cover corner or repeat as a pattern, giving the magazine an immediate identity hook without consuming the whole cover field.","Use a compact but forceful identity mark when each issue needs room for distinct artwork but still has to read instantly as part of the same publication family.","contents-taxonomy","Typography as the main section organizer","Instead of keeping essays, opinion, poems, art, and stories in rigid blocks, the redesign lets type choices differentiate content categories across the issue, turning hierarchy into a reading guide rather than a fixed map.","Let typography carry content taxonomy when an editorial product wants more sequencing freedom than hard section dividers provide.","feature-opener-spread","Flexible opening spreads with image-dialogue","The new grid abandons uniform article starts and gives openers more room for illustration, photography, and enlarged text, so each feature can establish its own pace before settling into body copy.","Relax opener templates when a publication needs each feature to earn attention through a distinct first spread instead of one repeated recipe.","section-color-coding","Color-coded paper moods for literary sections","Short stories appear on sky-blue pages and poetry on yellow pages, giving the reader a tactile signal that the pace and spacing have changed without resorting to heavy chapter dividers.","Use restrained color fields or stock changes to cue a different reading mode when editorial sections should feel separate but still live inside one issue.","configurable-logo","Issue identity anchor"],"roles":["case-reference","editorial-magazine-projects-reference"],"sourcePolicy":"inspiration-only","libraryId":"editorial-magazine-projects","status":"accepted","captureDepth":"artifact-study","sourceUrls":["https://www.pentagram.com/work/the-baffler"],"sourceUrlHashes":["13e666e3c7c902ee"],"files":{"catalog":"design-templates/editorial-magazine-projects/references/catalog.json","source":"design-templates/editorial-magazine-projects/references/entries/the-baffler-editorial-redesign.json","preview":"design-templates/editorial-magazine-projects/example.html"},"previewScope":"shared-collection"},{"id":"editorial-magazine-projects:wepresent-no-5-community-magazine","kind":"case-study","title":"WePresent No. 5","summary":"A strong editorial-system reference because a shared community brief yields three local editions rather than one universal visual answer: the New York edition turns a neighborhood walk into a map-led entry point, while its typographic range makes the issue fe…","sourcePath":"design-templates/editorial-magazine-projects/references/entries/wepresent-no-5-community-magazine.json","previewPath":"design-templates/editorial-magazine-projects/example.html","tags":["editorial-magazine-projects","community-edition-magazine","print editorial magazine","A community-focused issue of WeTransfer's arts and editorial platform, released in three localized design variants for New York, Amman, and Berlin","case-study"],"useCases":["editorial magazine projects","community-edition-magazine","print editorial magazine"],"userWords":["A strong editorial-system reference because a shared community brief yields three local editions rather than one universal visual answer: the New York edition turns a neighborhood walk into a map-led entry point, while its typographic range makes the issue fe…"],"visualTraits":["community-edition-magazine","WePresent No. 5","Paula Scher and team at Pentagram for WeTransfer / WePresent","https://www.pentagram.com/work/wepresent-no-5","print editorial magazine","A community-focused issue of WeTransfer's arts and editorial platform, released in three localized design variants for New York, Amman, and Berlin","neighborhood-route-map","Map-as-feature composition","The NoMad walking map makes a route, its landmarks, and the magazine's cover character operate as one feature concept rather than as separate decorative elements.","Let a map provide both navigational logic and visual hierarchy when an editorial story is rooted in a specific place; redraw every mark and route from original research.","cover-as-character","A single character creates an approachable cover anchor","The case study presents Mimi as the cover star and repeats the character in the community-focused editorial material, joining cover and interior through a simple narrative device.","Choose an original recurring subject when a publication needs a warm, memorable bridge from cover to feature without copying a source character or image.","localized-edition-system","Regional interpretation within a shared issue","The three city editions use different design teams under the same neighborhood and community brief. Their artwork, lettering, map, and imagery remain external source material and are not included here.","Specify shared editorial constraints before commissioning localized editions, then preserve space for each team to make genuinely local choices.","type-play-system","Display variation without abandoning editorial order","The source documents several named type treatments and hand lettering; the local shared preview uses only its existing original CSS and system-font approach.","Prototype typographic contrast with original copy, licensed fonts, and neutral geometry instead of recreating a source publication's artwork or lettering."],"roles":["case-reference","editorial-magazine-projects-reference"],"sourcePolicy":"inspiration-only","libraryId":"editorial-magazine-projects","status":"accepted","captureDepth":"case-study","sourceUrls":["https://www.pentagram.com/work/wepresent-no-5","https://wepresent.wetransfer.com/"],"sourceUrlHashes":["208bf884a5485123","4a3ffe925a91a44a"],"files":{"catalog":"design-templates/editorial-magazine-projects/references/catalog.json","source":"design-templates/editorial-magazine-projects/references/entries/wepresent-no-5-community-magazine.json","preview":"design-templates/editorial-magazine-projects/example.html"},"previewScope":"shared-collection"},{"id":"mobile-app-flow-projects:android-socialite-chat-media-recovery","kind":"case-study","title":"SociaLite chat media and reply recovery","summary":"An official Android sample turns a chat thread into a compact media workflow: capture from the conversation, edit a captured video, return to the thread, and recover an asynchronous reply through a notification when the app is closed. It is a useful reference…","sourcePath":"design-templates/mobile-app-flow-projects/references/entries/android-socialite-chat-media-recovery.json","previewPath":"design-templates/mobile-app-flow-projects/example.html","tags":["mobile-app-flow-projects","multi-screen-chat-media-flow-with-notification-recovery"],"useCases":["mobile app flow projects"],"userWords":["An official Android sample turns a chat thread into a compact media workflow: capture from the conversation, edit a captured video, return to the thread, and recover an asynchronous reply through a notification when the app is closed. It is a useful reference…"],"visualTraits":["SociaLite chat media and reply recovery","https://github.com/android/socialite","Android"],"roles":["case-reference","mobile-app-flow-projects-reference"],"sourcePolicy":"inspiration-only — record the documented mobile flow and recovery behavior in an original abstract preview. Do not copy SociaLite screenshots, animal avatars, media, names, marks, or bundled third-party assets. The source code is Apache-2.0, but third-party components retain their own notices.","libraryId":"mobile-app-flow-projects","status":"accepted","captureDepth":"multi-screen-chat-media-flow-with-notification-recovery","sourceUrls":["https://github.com/android/socialite","https://raw.githubusercontent.com/android/socialite/main/README.md","https://www.apache.org/licenses/LICENSE-2.0"],"sourceUrlHashes":["c449e1d3f0c6496c","670a56d5ca89a357","f2036f817d221f2a"],"files":{"catalog":"design-templates/mobile-app-flow-projects/references/catalog.json","source":"design-templates/mobile-app-flow-projects/references/entries/android-socialite-chat-media-recovery.json","preview":"design-templates/mobile-app-flow-projects/example.html"},"previewScope":"shared-collection"},{"id":"mobile-app-flow-projects:apple-maps-custom-route-builder","kind":"case-study","title":"Apple Maps custom route builder","summary":"A first-party documented route-builder flow that moves from freeform point placement to explicit reversible edits, a measurable review, and a location-aware choice to navigate or save. It is a compact reference for keeping an exploratory mobile task recoverab…","sourcePath":"design-templates/mobile-app-flow-projects/references/entries/apple-maps-custom-route-builder.json","previewPath":"design-templates/mobile-app-flow-projects/example.html","tags":["mobile-app-flow-projects","multi-source-flow-with-exceptions"],"useCases":["mobile app flow projects"],"userWords":["A first-party documented route-builder flow that moves from freeform point placement to explicit reversible edits, a measurable review, and a location-aware choice to navigate or save. It is a compact reference for keeping an exploratory mobile task recoverab…"],"visualTraits":["Apple Maps custom route builder","https://support.apple.com/en-ca/guide/iphone/iph3d7ebd491/ios","iPhone"],"roles":["case-reference","mobile-app-flow-projects-reference"],"sourcePolicy":"inspiration-only — record the documented task structure and constraints; do not reuse Apple Maps screens, cartography, icons, imagery, names, or marks. The local preview is an original abstract diagram.","libraryId":"mobile-app-flow-projects","status":"accepted","captureDepth":"multi-source-flow-with-exceptions","sourceUrls":["https://support.apple.com/en-ca/guide/iphone/iph3d7ebd491/ios","https://support.apple.com/en-euro/guide/iphone/iph837d13d03/26/ios/26","https://support.apple.com/en-nz/guide/iphone/ipha84a94043/ios"],"sourceUrlHashes":["ba9e23b97062140a","df6f882acd0ead83","a81540e77762ba5f"],"files":{"catalog":"design-templates/mobile-app-flow-projects/references/catalog.json","source":"design-templates/mobile-app-flow-projects/references/entries/apple-maps-custom-route-builder.json","preview":"design-templates/mobile-app-flow-projects/example.html"},"previewScope":"shared-collection"},{"id":"motion-interaction-projects:active-theory-creative-digital-experiences","kind":"case-study","title":"Active Theory · Creative Digital Experiences","summary":"A strong reference for turning a studio homepage into one immersive stage: the shell is built around a full-viewport scene, sparse copy, custom typography, and deliberate loader-to-experience boot behavior.","sourcePath":"design-templates/motion-interaction-projects/references/entries/active-theory-creative-digital-experiences.json","previewPath":"design-templates/motion-interaction-projects/example.html","tags":["motion-interaction-projects","immersive-agency-site","website","full-screen WebGL-first studio homepage","single-page-lead"],"useCases":["motion interaction projects","immersive-agency-site","website"],"userWords":["A strong reference for turning a studio homepage into one immersive stage: the shell is built around a full-viewport scene, sparse copy, custom typography, and deliberate loader-to-experience boot behavior."],"visualTraits":["immersive-agency-site","Active Theory · Creative Digital Experiences","Active Theory","https://activetheory.net/","website","full-screen WebGL-first studio homepage","stage-shell","Single viewport scene shell","The page is organized around one `#Stage` container that claims the full viewport instead of behaving like a normal document scroll.","Use when a motion-led site should feel like entering one scene rather than browsing stacked sections.","loader-sequence","Loader before scene boot","The HTML boot path preloads the main app script and treats the scene as a runtime that must be ready before the experience starts.","Use when cinematic pacing matters more than instant content dump, but keep fallback messaging visible.","custom-font","stage typography","The shell loads multiple weights of NB Architekt before the main app boot sequence.","Treat typography as part of the stage system, not a last-minute decorative layer.","3d-scene","primary visual field","The viewport is reserved for a JS-driven stage rather than a static hero image.","Plan scene ownership, boot timing, and mobile fallbacks before building visual motion.","loader-handoff","Boot into stage"],"roles":["case-reference","motion-interaction-projects-reference","motion-patterns"],"sourcePolicy":"inspiration-only","libraryId":"motion-interaction-projects","status":"backfill-needed","captureDepth":"single-page-lead","sourceUrls":["https://activetheory.net/"],"sourceUrlHashes":["433180293c3d969b"],"files":{"catalog":"design-templates/motion-interaction-projects/references/catalog.json","source":"design-templates/motion-interaction-projects/references/entries/active-theory-creative-digital-experiences.json","preview":"design-templates/motion-interaction-projects/example.html"},"previewScope":"shared-collection"},{"id":"motion-interaction-projects:cuberto-hello-digital-solutions-homepage","kind":"case-study","title":"Cuberto | We create digital solutions","summary":"A high-signal motion reference that keeps its craft in the DOM: custom cursor inversion, animated loader, menu overlay, reel sections, postcard flips, CTA ripples, and repeated autoplay media all work together as one branded interaction system.","sourcePath":"design-templates/motion-interaction-projects/references/entries/cuberto-hello-digital-solutions-homepage.json","previewPath":"design-templates/motion-interaction-projects/example.html","tags":["motion-interaction-projects","interactive-showreel-homepage","website","HTML-first motion-heavy agency showreel","single-page-lead"],"useCases":["motion interaction projects","interactive-showreel-homepage","website"],"userWords":["A high-signal motion reference that keeps its craft in the DOM: custom cursor inversion, animated loader, menu overlay, reel sections, postcard flips, CTA ripples, and repeated autoplay media all work together as one branded interaction system."],"visualTraits":["interactive-showreel-homepage","Cuberto | We create digital solutions","Cuberto","https://hello.cuberto.com/","website","HTML-first motion-heavy agency showreel","reel-wall","Brand and capability reels","Repeated reel sections turn logos, services, and social links into kinetic strips rather than static logo farms.","Use when repeated content should feel alive without becoming decorative noise.","card-stack","Postcard service stack","Service content is structured as front/back postcard cards so motion can reveal more depth without leaving the page.","Use when hover or tap should expose a second information layer inside the same section.","loader-sequence","Typographic loader overlay","The loader is treated as a branded scene with oversized typography instead of a generic spinner.","Make wait states part of the visual system when the site sells craft.","video-loop","section-level motion texture","The page uses many autoplay, muted video loops across achievements, icon moments, and footer background.","Break video into small narrative loops instead of relying on one massive hero clip.","custom-font","headline contrast system"],"roles":["case-reference","motion-interaction-projects-reference","motion-patterns"],"sourcePolicy":"inspiration-only","libraryId":"motion-interaction-projects","status":"accepted","captureDepth":"single-page-lead","sourceUrls":["https://hello.cuberto.com/"],"sourceUrlHashes":["49d588f0eb9e5683"],"files":{"catalog":"design-templates/motion-interaction-projects/references/catalog.json","source":"design-templates/motion-interaction-projects/references/entries/cuberto-hello-digital-solutions-homepage.json","preview":"design-templates/motion-interaction-projects/example.html"},"previewScope":"shared-collection"},{"id":"motion-interaction-projects:david-whyte-companion-portal-experience","kind":"case-study","title":"Experience & advantages - David Whyte","summary":"A distinctive reference for bringing editorial, audio, and membership-product storytelling into one immersive entry flow: the page uses watercolor-style stage media, sound controls, a scroll-to-explore prompt, and map-backed navigation to make a content archi…","sourcePath":"design-templates/motion-interaction-projects/references/entries/david-whyte-companion-portal-experience.json","previewPath":"design-templates/motion-interaction-projects/example.html","tags":["motion-interaction-projects","immersive-literary-portal","website","immersive companion-portal introduction with canvas, audio loops, and map-driven wayfinding","single-page-lead"],"useCases":["motion interaction projects","immersive-literary-portal","website"],"userWords":["A distinctive reference for bringing editorial, audio, and membership-product storytelling into one immersive entry flow: the page uses watercolor-style stage media, sound controls, a scroll-to-explore prompt, and map-backed navigation to make a content archi…"],"visualTraits":["immersive-literary-portal","Experience & advantages - David Whyte","David Whyte","https://davidwhyte.com/experience/","website","immersive companion-portal introduction with canvas, audio loops, and map-driven wayfinding","loader-sequence","Dedicated experience loader","The page has a specific LoaderExperience component before the exploratory stage begins, which separates the portal from the surrounding marketing site.","Use a dedicated loader when a special-mode experience should feel distinct from the rest of the site.","stage-shell","Canvas-led portal shell","A shared canvas, hidden video textures, audio loops, and stage controls frame the portal as one continuous environment rather than a collection of article cards.","Treat media, sound, and navigation as one shell when the goal is to create a world instead of a page.","scroll-chapter","Exploration steps into portal features","The experience introduces archive, map, poetry, and membership benefits as staged reveals with their own copy and CTA layers.","Use progressive feature reveals when a content-heavy platform would feel too abstract as a static benefits list.","video-loop","base and over texture channels","The page preloads base and over video textures for the experience stage rather than relying on one visible hero clip.","Layer quiet texture channels behind a canvas stage when the atmosphere matters as much as the content.","ui-overlay","loader, scroll cue, and sound controls"],"roles":["case-reference","motion-interaction-projects-reference","motion-patterns"],"sourcePolicy":"inspiration-only","libraryId":"motion-interaction-projects","status":"accepted","captureDepth":"single-page-lead","sourceUrls":["https://davidwhyte.com/experience"],"sourceUrlHashes":["f7f02b738a176ed2"],"files":{"catalog":"design-templates/motion-interaction-projects/references/catalog.json","source":"design-templates/motion-interaction-projects/references/entries/david-whyte-companion-portal-experience.json","preview":"design-templates/motion-interaction-projects/example.html"},"previewScope":"shared-collection"},{"id":"motion-interaction-projects:kode-immersive-tech-enabled-creativity-homepage","kind":"case-study","title":"KODE Immersive - Tech-Enabled Creativity, Unforgettable Experiences.","summary":"A strong reference for blending cinematic staging with explicit interaction prompts: the site treats the preloader, scratch reveal, step-based services section, and sound controls as one continuous narrative system instead of separate gimmicks.","sourcePath":"design-templates/motion-interaction-projects/references/entries/kode-immersive-tech-enabled-creativity-homepage.json","previewPath":"design-templates/motion-interaction-projects/example.html","tags":["motion-interaction-projects","immersive-storytelling-agency-site","website","Nuxt-based immersive agency homepage with canvas scenes and guided interaction","single-page-lead"],"useCases":["motion interaction projects","immersive-storytelling-agency-site","website"],"userWords":["A strong reference for blending cinematic staging with explicit interaction prompts: the site treats the preloader, scratch reveal, step-based services section, and sound controls as one continuous narrative system instead of separate gimmicks."],"visualTraits":["immersive-storytelling-agency-site","KODE Immersive - Tech-Enabled Creativity, Unforgettable Experiences.","KODE Immersive","https://kodeimmersive.com/","website","Nuxt-based immersive agency homepage with canvas scenes and guided interaction","loader-sequence","Enter-gated preloader scene","The first frame is a branded preloader with a hidden counter, lottie animation, and an explicit Enter action instead of an automatic handoff.","Use when a story-led site should give visitors a moment to opt into the experience instead of dropping them straight into the main scroll.","scroll-chapter","Alternating text and canvas chapters","The page alternates oversized justified text panels, fixed bottom-bar cues, canvas-backed scenes, and narrative copy blocks to keep the scroll rhythm varied.","Use when immersive storytelling needs strong pacing changes between copy-heavy beats and visual interaction beats.","stage-shell","Full-viewport canvas shell","Canvas layers for the background, mouse trails, chevrons, noise, and hero moments stay mounted around the content instead of appearing as one isolated hero widget.","Keep the stage infrastructure persistent when motion cues should connect the whole page rather than one section.","3d-scene","hero and section-level canvases","The homepage reserves multiple canvases for the preloader, background, chevron, noise, and scratch interactions.","Plan canvas ownership at the page shell level when multiple chapters depend on the same motion runtime.","custom-font","voice contrast between operational copy and expressive display"],"roles":["case-reference","motion-interaction-projects-reference","motion-patterns"],"sourcePolicy":"inspiration-only","libraryId":"motion-interaction-projects","status":"accepted","captureDepth":"single-page-lead","sourceUrls":["https://kodeimmersive.com/"],"sourceUrlHashes":["ab573de1fa91b38f"],"files":{"catalog":"design-templates/motion-interaction-projects/references/catalog.json","source":"design-templates/motion-interaction-projects/references/entries/kode-immersive-tech-enabled-creativity-homepage.json","preview":"design-templates/motion-interaction-projects/example.html"},"previewScope":"shared-collection"},{"id":"motion-interaction-projects:muhammad-ali-center-immersive-timeline","kind":"case-study","title":"Muhammad Ali Center","summary":"A strong reference for making a deep institutional archive feel explorable rather than overwhelming: a layered timeline starts with broad ideals, then reveals more detailed related content through deliberate zoom levels.","sourcePath":"design-templates/motion-interaction-projects/references/entries/muhammad-ali-center-immersive-timeline.json","previewPath":"design-templates/motion-interaction-projects/example.html","tags":["motion-interaction-projects","immersive-cultural-institution-timeline","cultural-institution website","CMS-editable immersive biography timeline","first-party-case-study"],"useCases":["motion interaction projects","immersive-cultural-institution-timeline","cultural-institution website"],"userWords":["A strong reference for making a deep institutional archive feel explorable rather than overwhelming: a layered timeline starts with broad ideals, then reveals more detailed related content through deliberate zoom levels."],"visualTraits":["immersive-cultural-institution-timeline","Muhammad Ali Center","Dogstudio for the Muhammad Ali Center","https://dogstudio.co/cases/muhammad-ali-center/","cultural-institution website","CMS-editable immersive biography timeline","zoomable-biography-timeline","Timeline as a distinct immersive destination","Dogstudio describes the Muhammad Ali timeline as an immersive experience within the wider site, dedicated to browsing key moments from his life.","Treat a dense chronology as a named destination with its own orientation and pacing, rather than appending every event to a conventional content page.","stage-shell","Broad-to-specific content hierarchy","The case frames the wider platform around cultural offerings, education, social-justice initiatives, and community programmes before introducing the dedicated timeline.","Establish a clear primary information architecture before offering an immersive branch, so an expressive interaction does not become the only route into institutional content.","custom-font","editorial hierarchy","Dogstudio identifies Founders Grotesk X-Condensed, Antonia Variable, and Guillon as the project type combination; no type files or source artwork are included here.","Use an independently licensed or original type system with clear display, narrative, and utility roles instead of reproducing the source typography.","ui-overlay","timeline orientation and level control","The source describes multiple timeline zoom levels that lead from high-level ideas toward related content.","Keep the active zoom level, available depth, and return path visible whenever an interface lets people enter a layered narrative.","narrative-zoom","Progressive detail through zoom levels"],"roles":["case-reference","motion-interaction-projects-reference","motion-patterns"],"sourcePolicy":"inspiration-only","libraryId":"motion-interaction-projects","status":"accepted","captureDepth":"first-party-case-study","sourceUrls":["https://dogstudio.co/cases/muhammad-ali-center","https://alicenter.org/"],"sourceUrlHashes":["c3c10686ca8486e9","8c4af5198ec48141"],"files":{"catalog":"design-templates/motion-interaction-projects/references/catalog.json","source":"design-templates/motion-interaction-projects/references/entries/muhammad-ali-center-immersive-timeline.json","preview":"design-templates/motion-interaction-projects/example.html"},"previewScope":"shared-collection"},{"id":"motion-interaction-projects:resn-creative-digital-agency-homepage","kind":"case-study","title":"Resn - Creative Digital Agency","summary":"A compact reference for the older but still useful immersive-agency shell: black-screen loader, progress bar, JS bootstrapping, and a positioning stack that explicitly spans motion, audio, 3D, and interactive graphics.","sourcePath":"design-templates/motion-interaction-projects/references/entries/resn-creative-digital-agency-homepage.json","previewPath":"design-templates/motion-interaction-projects/example.html","tags":["motion-interaction-projects","motion-studio-homepage","website","loader-led interactive agency homepage","single-page-lead"],"useCases":["motion interaction projects","motion-studio-homepage","website"],"userWords":["A compact reference for the older but still useful immersive-agency shell: black-screen loader, progress bar, JS bootstrapping, and a positioning stack that explicitly spans motion, audio, 3D, and interactive graphics."],"visualTraits":["motion-studio-homepage","Resn - Creative Digital Agency","Resn","https://resn.co.nz/","website","loader-led interactive agency homepage","loader-sequence","Progress bar landing shell","The first visible layer is a full-screen loader with a dedicated progress bar before the runtime is attached.","Use when the experience benefits from a deliberate prelude instead of jumping straight into content.","stage-shell","Black-canvas base layer","The shell sets a black background and defers the interactive experience to a JS loader rather than laying out a normal DOM-first homepage.","Use for immersive portfolios or studio sites where motion direction should own the first impression.","video-loop","immersive media layer","The page metadata and shell language point to a media system that mixes video with interactive graphics.","Plan media as a native part of the experience instead of one disconnected hero clip.","ui-overlay","loader and compatibility messaging","Progress bars and browser-support messaging are treated as first-class visual layers.","Keep boot, wait, and failure states visually aligned with the main stage.","loader-handoff","Progress-led boot sequence"],"roles":["case-reference","motion-interaction-projects-reference","motion-patterns"],"sourcePolicy":"inspiration-only","libraryId":"motion-interaction-projects","status":"backfill-needed","captureDepth":"single-page-lead","sourceUrls":["https://resn.co.nz/"],"sourceUrlHashes":["df29929e5159b60c"],"files":{"catalog":"design-templates/motion-interaction-projects/references/catalog.json","source":"design-templates/motion-interaction-projects/references/entries/resn-creative-digital-agency-homepage.json","preview":"design-templates/motion-interaction-projects/example.html"},"previewScope":"shared-collection"},{"id":"motion-interaction-projects:unseen-studio-year-in-review-2025","kind":"case-study","title":"Year in Review 2025 - Unseen Studio","summary":"A high-signal reference for turning a studio recap into an immersive editorial object: the experience uses a horizontal scroll container, a giant dashed timeline, looping media, month-based chaptering, and outbound case-study links without losing its narrativ…","sourcePath":"design-templates/motion-interaction-projects/references/entries/unseen-studio-year-in-review-2025.json","previewPath":"design-templates/motion-interaction-projects/example.html","tags":["motion-interaction-projects","horizontal-year-in-review","website","horizontal editorial timeline with video chapters and parallax text","single-page-lead"],"useCases":["motion interaction projects","horizontal-year-in-review","website"],"userWords":["A high-signal reference for turning a studio recap into an immersive editorial object: the experience uses a horizontal scroll container, a giant dashed timeline, looping media, month-based chaptering, and outbound case-study links without losing its narrativ…"],"visualTraits":["horizontal-year-in-review","Year in Review 2025 - Unseen Studio","Unseen Studio","https://2025.unseen.co/","website","horizontal editorial timeline with video chapters and parallax text","timeline-ribbon","32,000px timeline spine","The story rides on one oversized SVG line that behaves like a visual rail through the entire year.","Use when a long-form motion story needs one persistent orienting device instead of restarting the layout each chapter.","scroll-chapter","Month-by-month horizontal chapters","Each month is framed as its own chapter with date typography, short editorial copy, and a dedicated media beat.","Use for portfolios, annual reports, or product histories that benefit from clearly named sequential beats.","stage-shell","Intro stage with canvas and looped eye video","The introduction combines fixed overlay typography, a canvas layer, and a hidden autoplay eye-loop video before the month timeline begins.","Open long-form stories with one theatrical stage that teaches the interaction model before the dense content starts.","video-loop","chapter media and intro stage texture","The intro uses an autoplay loop and many chapters rely on looping MP4 moments instead of static thumbnails.","Use short loops to keep long editorial stories visually alive without requiring full video playback controls in every panel.","custom-font","date hierarchy and script accents"],"roles":["case-reference","motion-interaction-projects-reference","motion-patterns"],"sourcePolicy":"inspiration-only","libraryId":"motion-interaction-projects","status":"accepted","captureDepth":"single-page-lead","sourceUrls":["https://2025.unseen.co/"],"sourceUrlHashes":["7f51a4410234652c"],"files":{"catalog":"design-templates/motion-interaction-projects/references/catalog.json","source":"design-templates/motion-interaction-projects/references/entries/unseen-studio-year-in-review-2025.json","preview":"design-templates/motion-interaction-projects/example.html"},"previewScope":"shared-collection"},{"id":"motion-interaction-projects:virgin-galactic-spaceflight-experience","kind":"case-study","title":"Virgin Galactic - Dogstudio","summary":"A strong motion reference for making a technical product story feel spatial without turning the interface into a passive film: Dogstudio combines linked WebGL subscenes, a 3D spacecraft sequence, and scroll-or-swipe transitions with conventional CMS content s…","sourcePath":"design-templates/motion-interaction-projects/references/entries/virgin-galactic-spaceflight-experience.json","previewPath":"design-templates/motion-interaction-projects/example.html","tags":["motion-interaction-projects","webgl-spaceflight-story","website","scroll-and-swipe WebGL journey through a 3D spacecraft story","single-page-lead"],"useCases":["motion interaction projects","webgl-spaceflight-story","website"],"userWords":["A strong motion reference for making a technical product story feel spatial without turning the interface into a passive film: Dogstudio combines linked WebGL subscenes, a 3D spacecraft sequence, and scroll-or-swipe transitions with conventional CMS content s…"],"visualTraits":["webgl-spaceflight-story","Virgin Galactic - Dogstudio","Dogstudio for Virgin Galactic","https://dogstudio.co/cases/virgin-galactic/","website","scroll-and-swipe WebGL journey through a 3D spacecraft story","stage-shell","Linked WebGL subscenes","Dogstudio describes a multi-scene WebGL system that moves visitors through the flight narrative rather than presenting one isolated hero animation.","Split a long 3D story into purposeful scenes with explicit content beats instead of treating the canvas as decoration.","scroll-chapter","Spaceflight steps paired with CMS content","The case pairs the 3D experience with ordinary editorial and card content, so the story has readable anchors beyond the immersive moments.","Keep explanatory copy and conventional navigation available alongside spatial scenes.","3d-scene","spacecraft and flight environment","The case documents a 3D spacecraft sequence inside multiple WebGL subscenes.","Reserve real-time 3D for a specific narrative object, then let standard content carry the supporting detail.","showcase-media","editorial and CMS-managed flight content","The case describes CMS-backed content surfaces around the interactive flight sequence.","Use managed content to keep an immersive campaign maintainable after its launch sequence is built.","Scroll-or-swipe scene transitions","The case documents event-driven scroll and swipe animation, including a two-way pinning and clipping transition between scenes."],"roles":["case-reference","motion-interaction-projects-reference","motion-patterns"],"sourcePolicy":"inspiration-only","libraryId":"motion-interaction-projects","status":"accepted","captureDepth":"single-page-lead","sourceUrls":["https://dogstudio.co/cases/virgin-galactic"],"sourceUrlHashes":["09340ff4cbebfbe0"],"files":{"catalog":"design-templates/motion-interaction-projects/references/catalog.json","source":"design-templates/motion-interaction-projects/references/entries/virgin-galactic-spaceflight-experience.json","preview":"design-templates/motion-interaction-projects/example.html"},"previewScope":"shared-collection"},{"id":"personal-blog-projects:ahmad-shadeed","kind":"case-study","title":"Ahmad Shadeed","summary":"A strong design-engineer reference where consulting, education, and publishing are kept in one consistent visual system, making the site feel like a working studio rather than a blog bolted onto a portfolio.","sourcePath":"design-templates/personal-blog-projects/references/catalog.json","previewPath":"design-templates/personal-blog-projects/example.html","tags":["design-engineer-site","en","global","design engineer site with visual CSS publishing, client work, and speaking archive","personal-blog"],"useCases":["personal site","blog","digital garden","design enginee e a design festival feel argumentative rather than merely celebratory."],"visualTraits":["festival-poster-system","European Design Festival","Studio Dumbar/DEPT®","https://studiodumbar.com/work/european-design-festival","poster series","Festival identity system spanning posters, banners, and flags","slogan-field","Declarative slogan posters","Statements such as 'Reset to default settings,' 'Make bold statements,' and 'Who draws the line?' are treated as the image itself, giving each poster a blunt verbal hook before any secondary explanation appears.","Let a short declarative line occupy the hero position when a poster needs immediate ideological clarity and can rely on typography more than illustration.","flag-fragment-layering","European-flag fragments as modular fields","The graphics borrow parts of European flags instead of quoting one nation wholesale, turning familiar stripes and color blocks into a shared but unstable political backdrop.","Sample recognizable civic symbols in fragments when a poster should feel public and collective without collapsing into one literal emblem.","march-poster-grid","Cross-format protest system","The same rough lettering and confrontational statements carry across posters, banners, and flags, so the identity reads like a coordinated demonstration rather than isolated layouts.","Build one loud graphic grammar that can survive format changes when an event identity needs street-level cohesion across print surfaces.","hand-drawn-lettering","primary rhetorical image","Bold hand-drawn lettering makes the posters feel urgent and human instead of polished or institutional.","Use imperfect lettering when a poster should signal debate, dissent, or participation rather than corporate neutrality.","flag-fragment-graphics","shared political color and shape system"],"roles":["case-reference","poster-projects-reference"],"sourcePolicy":"inspiration-only","libraryId":"poster-projects","status":"accepted","captureDepth":"artifact-study","sourceUrls":["https://studiodumbar.com/work/european-design-festival"],"sourceUrlHashes":["d611320979296bb2"],"files":{"catalog":"design-templates/poster-projects/references/catalog.json","source":"design-templates/poster-projects/references/entries/european-design-festival-protest-identity-posters.json","preview":"design-templates/poster-projects/example.html"},"previewScope":"shared-collection"},{"id":"poster-projects:giff-2025-technological-aesthetics-poster","kind":"case-study","title":"GIFF 2025 Poster","summary":"A clear reference for making a complex festival feel interconnected: colorful transparent blocks form the two event logos, turning system logic and data-like assembly into the poster's primary image.","sourcePath":"design-templates/poster-projects/references/entries/giff-2025-technological-aesthetics-poster.json","previewPath":"design-templates/poster-projects/example.html","tags":["poster-projects","festival-poster-system","festival poster and visual identity","Poster system for GIFF and Geneva Digital Market","artifact-study"],"useCases":["poster projects","festival-poster-system","festival poster and visual identity"],"userWords":["A clear reference for making a complex festival feel interconnected: colorful transparent blocks form the two event logos, turning system logic and data-like assembly into the poster's primary image."],"visualTraits":["festival-poster-system","GIFF 2025 Poster","Andréa Philippon for the Geneva International Film Festival","https://www.giff.ch/en/affiche-2025/","festival poster and visual identity","Poster system for GIFF and Geneva Digital Market","transparent-block-logo","Logos as a constructed object","Transparent, colorful blocks interlock to form GIFF and GDM, so the mark reads as a built environment rather than a flat lockup.","Translate a multi-part event or product family into one modular object whose pieces can recombine across formats.","modular-color-field","Accessible data-wall energy","The visual language pairs vivid color with transparent overlaps and dynamic blocks, balancing technological aesthetics with an accessible festival tone.","Use a saturated palette with translucent layers when a technical theme needs warmth and collective energy rather than cold interface literalism.","transparent-3d-blocks","primary image grammar","The source describes the blocks as colorful, transparent, dynamic, and interlocking; no external assets are copied into this library.","Rebuild the grammar with original CSS, SVG, or 3D primitives rather than reusing the source artwork.","display-type","event identification","The formed logos carry the identity while the modular blocks supply the visual texture.","Let identity emerge from the construction system when a poster must hold multiple related names."],"roles":["case-reference","poster-projects-reference"],"sourcePolicy":"inspiration-only","libraryId":"poster-projects","status":"accepted","captureDepth":"artifact-study","sourceUrls":["https://www.giff.ch/en/affiche-2025","https://andreaphilippon.com/"],"sourceUrlHashes":["e5b07a44a6d53d3c","fd809cf518e0a0dc"],"files":{"catalog":"design-templates/poster-projects/references/catalog.json","source":"design-templates/poster-projects/references/entries/giff-2025-technological-aesthetics-poster.json","preview":"design-templates/poster-projects/example.html"},"previewScope":"shared-collection"},{"id":"poster-projects:its-all-our-blood-hiroshima-nagasaki-commemorative-poster","kind":"case-study","title":"It's All Our Blood","summary":"A strong poster reference for building the entire argument around one physical image-making experiment: the page shows how a single red cloud photograph, strict white space, and restrained timing annotations can carry memorial weight without decorative clutte…","sourcePath":"design-templates/poster-projects/references/entries/its-all-our-blood-hiroshima-nagasaki-commemorative-poster.json","previewPath":"design-templates/poster-projects/example.html","tags":["poster-projects","commemorative-cultural-poster","poster","Commemorative exhibition poster paired with a process film","artifact-study"],"useCases":["poster projects","commemorative-cultural-poster","poster"],"userWords":["A strong poster reference for building the entire argument around one physical image-making experiment: the page shows how a single red cloud photograph, strict white space, and restrained timing annotations can carry memorial weight without decorative clutte…"],"visualTraits":["commemorative-cultural-poster","It's All Our Blood","Pentagram / Harry Pearce for the University of Maryland Art Gallery","https://www.pentagram.com/work/its-all-our-blood","poster","Commemorative exhibition poster paired with a process film","single-image-field","Isolated blood-cloud focal image","The core image is a photograph of a drop of blood hitting water, held alone so the resulting red cloud reads like an atomic blast rather than a collage of symbols.","Use one dominant metaphor image when a poster needs immediate symbolic force and should not dilute the concept with secondary illustrations.","white-ground-layout","High-contrast white memorial field","The project sets the image on a white background, letting the red cloud do nearly all of the emotional work while the surrounding negative space keeps the poster solemn and legible.","Use a large unprinted field when the subject matter benefits from silence, pause, or gallery-like framing.","forensic-caption","Time-and-place annotation strip","Grey and black type marks the locations and times of the bombings, turning factual metadata into part of the composition instead of a detached caption block.","Fold documentary details into the poster grid when context should sharpen the concept without competing with the hero image.","experimental-photography","single symbolic hero image","The final poster image came from repeated physical tests with blood, water temperature, and drop height, then a last-frame photograph by Richard Foster.","Prototype the central image materially when the poster concept depends on texture, unpredictability, or physical truth.","annotation-type","historical context and measured tone"],"roles":["case-reference","poster-projects-reference","motion-patterns"],"sourcePolicy":"inspiration-only","libraryId":"poster-projects","status":"accepted","captureDepth":"artifact-study","sourceUrls":["https://www.pentagram.com/work/its-all-our-blood"],"sourceUrlHashes":["c76ebfb7c1ec8570"],"files":{"catalog":"design-templates/poster-projects/references/catalog.json","source":"design-templates/poster-projects/references/entries/its-all-our-blood-hiroshima-nagasaki-commemorative-poster.json","preview":"design-templates/poster-projects/example.html"},"previewScope":"shared-collection"},{"id":"poster-projects:shakespeare-in-the-park-2025-reopening-posters","kind":"case-study","title":"Shakespeare in the Park 2025","summary":"A strong poster-system reference because it derives one year's graphic shift from a concrete spatial cue instead of generic seasonal novelty. The campaign turns the Delacorte's circular seating plan into a poster grammar, then layers manipulated house typogra…","sourcePath":"design-templates/poster-projects/references/entries/shakespeare-in-the-park-2025-reopening-posters.json","previewPath":"design-templates/poster-projects/example.html","tags":["poster-projects","theater-poster-system","poster campaign","Season-reopening poster system with dynamic digital animations for the Delacorte Theater relaunch","artifact-study"],"useCases":["poster projects","theater-poster-system","poster campaign"],"userWords":["A strong poster-system reference because it derives one year's graphic shift from a concrete spatial cue instead of generic seasonal novelty. The campaign turns the Delacorte's circular seating plan into a poster grammar, then layers manipulated house typogra…"],"visualTraits":["theater-poster-system","Shakespeare in the Park 2025","Pentagram / Paula Scher for The Public Theater","https://www.pentagram.com/work/shakespeare-in-the-park-2025","poster campaign","Season-reopening poster system with dynamic digital animations for the Delacorte Theater relaunch","circular-seat-grid","Circular poster field borrowed from the venue itself","Pentagram says the 2025 design is circular for the first time, using the concentric rows of seats at the renovated Delacorte as the base visual idea rather than defaulting to a rectangular stage-poster grid.","Pull a poster's primary geometry from the venue or event architecture when a reopening or anniversary needs a form that feels earned, not decorative.","type-lockup","House typography stretched into a seasonal one-off voice","The campaign keeps The Public Theater's Knockout-based identity but pushes it into another yearly variation, proving a poster series can stay recognizably branded while still feeling like a new episode.","Treat the brand display face as a material to manipulate each season when continuity matters more than inventing a separate poster type system.","layered-color-tapestry","Color shapes and type woven into one festive surface","Pentagram describes the posters and digital animations as layered type over shapes, creating a dense tapestry of color that feels celebratory enough for a reopening without relying on illustration or photography.","Use overlapping shape fields to turn a text-led poster into a vivid event surface when the message needs energy but the system should stay mostly typographic.","display-title","Primary seasonal voice","The campaign continues the long-running Shakespeare in the Park tradition of reworking Knockout into a fresh poster expression each year.","Recast an existing display type family before swapping brands entirely when a recurring poster series needs novelty with continuity.","concentric-color-shapes","Spatial memory and festival atmosphere"],"roles":["case-reference","poster-projects-reference","motion-patterns"],"sourcePolicy":"inspiration-only","libraryId":"poster-projects","status":"accepted","captureDepth":"artifact-study","sourceUrls":["https://www.pentagram.com/work/shakespeare-in-the-park-2025"],"sourceUrlHashes":["03b35a263b395cb8"],"files":{"catalog":"design-templates/poster-projects/references/catalog.json","source":"design-templates/poster-projects/references/entries/shakespeare-in-the-park-2025-reopening-posters.json","preview":"design-templates/poster-projects/example.html"},"previewScope":"shared-collection"},{"id":"poster-projects:sonisk-functional-poster","kind":"case-study","title":"Functional Poster for Sonisk Music Film Festival","summary":"A valuable poster reference because the artifact is both a wall-facing key visual and a useful program. Its black-and-yellow system, sound-derived grid, and foldout behavior make information architecture part of the concept.","sourcePath":"design-templates/poster-projects/references/entries/sonisk-functional-poster.json","previewPath":"design-templates/poster-projects/example.html","tags":["poster-projects","functional-festival-poster","fold-out festival poster and program","Poster that unfolds into a newspaper-style festival guide","case-summary"],"useCases":["poster projects","functional-festival-poster","fold-out festival poster and program"],"userWords":["A valuable poster reference because the artifact is both a wall-facing key visual and a useful program. Its black-and-yellow system, sound-derived grid, and foldout behavior make information architecture part of the concept."],"visualTraits":["functional-festival-poster","Functional Poster for Sonisk Music Film Festival","Agency Skogen; art direction Magnus Holder Bjørk","https://awards.europeandesign.org/winner/262643","fold-out festival poster and program","Poster that unfolds into a newspaper-style festival guide","foldout-program","Poster-to-program transformation","The poster functions as a striking object when closed, then unfolds into a newspaper-style guide for the festival program.","Give a printed key visual a second useful state when the audience needs both recognition at a distance and dense event information.","sound-derived-grid","Identity derived from the subject","The European Design Awards case describes a grid derived from the festival logo, with the logo itself generated from sound.","Derive graphic geometry from the event's medium or behavior so the visual system explains what the event is about without illustration.","limited-color-palette","recognition and contrast","Black and yellow provide a compact, high-contrast system that supports both poster impact and program legibility.","Keep the palette intentionally narrow when a poster needs to survive both display distance and information-heavy interior panels.","newspaper-style-program","functional information layer","The foldout format turns a promotional surface into a tactile schedule and guide.","Treat editorial density as a planned second state, not an afterthought added below the hero image."],"roles":["case-reference","poster-projects-reference"],"sourcePolicy":"inspiration-only","libraryId":"poster-projects","status":"lead","captureDepth":"case-summary","sourceUrls":["https://awards.europeandesign.org/winner/262643"],"sourceUrlHashes":["e8e39aa0ea868615"],"files":{"catalog":"design-templates/poster-projects/references/catalog.json","source":"design-templates/poster-projects/references/entries/sonisk-functional-poster.json","preview":"design-templates/poster-projects/example.html"},"previewScope":"shared-collection"},{"id":"poster-projects:storefront-gala-2025-wpa-event-posters","kind":"case-study","title":"Storefront Gala 2025","summary":"A strong poster-system reference because it turns one dinner venue and one historical poster lineage into a compact graphic grammar. Instead of decorating the gala with generic heritage cues, the case uses WPA-style compression, a purpose-built display face,…","sourcePath":"design-templates/poster-projects/references/entries/storefront-gala-2025-wpa-event-posters.json","previewPath":"design-templates/poster-projects/example.html","tags":["poster-projects","event-poster-identity-system","poster-led event identity","Annual gala poster and event-key-visual system built from WPA poster density, a custom condensed typeface, and venue-derived pattern cues","artifact-study"],"useCases":["poster projects","event-poster-identity-system","poster-led event identity"],"userWords":["A strong poster-system reference because it turns one dinner venue and one historical poster lineage into a compact graphic grammar. Instead of decorating the gala with generic heritage cues, the case uses WPA-style compression, a purpose-built display face,…"],"visualTraits":["event-poster-identity-system","Storefront Gala 2025","Pentagram / Natasha Jen for Storefront for Art and Architecture","https://www.pentagram.com/work/storefront-gala-2025","poster-led event identity","Annual gala poster and event-key-visual system built from WPA poster density, a custom condensed typeface, and venue-derived pattern cues","compressed-wpa-grid","WPA-style density used as the main poster rhythm","Pentagram says the identity channels WPA posters through compressed layouts, blocky rhythms, and typographic density, making the headline field do the persuasive work instead of relying on illustration-heavy scenes.","When an event needs civic authority fast, borrow the pressure and density of historical public-information posters rather than building a loose celebratory collage.","type-lockup","Custom condensed typeface becomes the hero image","The team designed a geometric condensed sans serif with angled corners, then used its narrow proportions as a deliberate counterpoint to Storefront's wider institutional lettering.","Make the custom display face carry the poster's personality when one-off event graphics need distinction without inventing a separate illustration system.","checkerboard-accent-band","Venue pattern turns into a festive secondary field","Bright pink type is paired with a red-and-white checkerboard motif lifted from the Oyster Bar tablecloths, tying the gala posters to the room through a simple repeating surface rather than literal architectural drawings.","Extract one repeatable pattern from the venue itself when an event poster should feel site-specific but still stay graphic and scalable.","custom-condensed-typeface","primary graphic voice","The bespoke geometric condensed sans serif supplies the posters' density, contrast, and WPA inflection while staying distinct from Storefront's standing identity.","Commission or adapt one narrow display face when poster copy needs to stack tightly without collapsing into generic condensed defaults.","checkerboard-pattern","venue-memory pattern layer"],"roles":["case-reference","poster-projects-reference"],"sourcePolicy":"inspiration-only","libraryId":"poster-projects","status":"accepted","captureDepth":"artifact-study","sourceUrls":["https://www.pentagram.com/work/storefront-gala-2025","https://www.pentagram.com/news/category/work?page=2"],"sourceUrlHashes":["33daea98065591b6","50a5d6b79de3c0b7"],"files":{"catalog":"design-templates/poster-projects/references/catalog.json","source":"design-templates/poster-projects/references/entries/storefront-gala-2025-wpa-event-posters.json","preview":"design-templates/poster-projects/example.html"},"previewScope":"shared-collection"},{"id":"poster-projects:williamstown-theatre-festival-2025","kind":"case-study","title":"Williamstown Theatre Festival 2025","summary":"A clear reference for keeping a festival identity recognizable while changing its yearly art direction: one blur behavior gives distinct performance images a shared sense of motion across print, environmental, and digital formats.","sourcePath":"design-templates/poster-projects/references/entries/williamstown-theatre-festival-2025.json","previewPath":"design-templates/poster-projects/example.html","tags":["poster-projects","festival-poster-system","festival visual identity and performance key-visual system","2025 theatre-festival poster and key-visual system","case-study"],"useCases":["poster projects","festival-poster-system","festival visual identity and performance key-visual system"],"userWords":["A clear reference for keeping a festival identity recognizable while changing its yearly art direction: one blur behavior gives distinct performance images a shared sense of motion across print, environmental, and digital formats."],"visualTraits":["festival-poster-system","Williamstown Theatre Festival 2025","Pentagram (Andrea Trabucco-Campos and team) for Williamstown Theatre Festival","https://www.pentagram.com/work/williamstown-theatre-festival-2025","festival visual identity and performance key-visual system","2025 theatre-festival poster and key-visual system","blurred-performance-field","Motion frozen into each performance image","Pentagram applies a blur motion behavior to photography and typography, then uses a distinct key image to convey each performance.","Define one transformation rule that can make varied subjects feel like a coherent event season without forcing them into one repeated picture.","cross-channel-stage-system","A key visual that scales through the festival ecosystem","The system extends from performance key visuals to signage, wayfinding, programme design, badges, digital billboards, social media, and merchandise.","Treat the poster composition as a portable rule set, then test its hierarchy at close-reading, streetscape, and scrolling scales.","performance-photography","performance-specific image field","The source documents key images for individual performances; no source photography is copied into this library.","Use original or licensed imagery with an equivalent movement treatment rather than reusing campaign photography.","condensed-serif-type-system","stable typographic foundation","The case study identifies Review Condensed and Times New Roman as the bold-and-evergreen type pairing.","Pair a high-impact condensed face with a quieter text face when changing art direction still needs a stable information voice.","dynamic-stage-graphic","identity continuity"],"roles":["case-reference","poster-projects-reference","motion-patterns"],"sourcePolicy":"inspiration-only","libraryId":"poster-projects","status":"accepted","captureDepth":"case-study","sourceUrls":["https://www.pentagram.com/work/williamstown-theatre-festival-2025","https://www.wtfestival.org/"],"sourceUrlHashes":["d2cc134256298fb5","08e41a9fd0a3ecc8"],"files":{"catalog":"design-templates/poster-projects/references/catalog.json","source":"design-templates/poster-projects/references/entries/williamstown-theatre-festival-2025.json","preview":"design-templates/poster-projects/example.html"},"previewScope":"shared-collection"},{"id":"product-ui-projects:linear-product-development-system","kind":"case-study","title":"Linear","summary":"A high-signal reference for AI-era product operations: triage, issue ownership, project planning, cycles, and analytics all read as one compact operating system instead of separate admin tools.","sourcePath":"design-templates/product-ui-projects/references/catalog.json","previewPath":"design-templates/product-ui-projects/example.html","tags":["product development software","product development workspace","surface-suite","product-ui"],"useCases":["product UI","SaaS","console","product development workspace"],"userWords":["A high-signal reference for AI-era product operations: triage, issue ownership, project planning, cycles, and analytics all read as one compact operating system instead of separate admin tools."],"visualTraits":["product development software","product development workspace"],"roles":["project-reference","surface-suite","flow-patterns","state-patterns","component-patterns"],"sourcePolicy":"inspiration-only","libraryId":"product-ui-projects","status":"accepted","captureDepth":"surface-suite","sourceUrls":["https://linear.app/docs/triage","https://linear.a
