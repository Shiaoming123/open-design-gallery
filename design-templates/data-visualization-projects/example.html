<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Visualization Projects</title><style>:root{--bg:#f4efe6;--ink:#20201e;--line:#cfc6b8;--paper:#fffdf8;--blue:#356f89;--rust:#b85f42}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}main{width:min(980px,calc(100% - 32px));margin:auto;padding:48px 0}h1{font:700 42px/1.05 Georgia,serif;margin:0 0 12px}.eyebrow{color:var(--rust);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.panel{margin-top:28px;padding:22px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}.chart{height:220px;display:flex;align-items:end;gap:10px;padding-top:24px;border-bottom:1px solid var(--line)}.bar{width:14%;background:var(--blue);border-radius:5px 5px 0 0}.bar:nth-child(2n){background:var(--rust)}.empty{margin:18px 0 0;color:#6b655d}@media(max-width:600px){h1{font-size:34px}.chart{height:170px}}</style></head><body><main><p class="eyebrow">Original local preview</p><h1>Read the data shape before choosing the chart.</h1><p>The lane records hierarchy, encoding, interaction, and an accessible fallback.</p><section class="panel"><div class="chart" aria-label="Abstract original bar chart"><span class="bar" style="height:34%"></span><span class="bar" style="height:56%"></span><span class="bar" style="height:42%"></span><span class="bar" style="height:78%"></span><span class="bar" style="height:63%"></span><span class="bar" style="height:92%"></span></div><p class="empty">No accepted references yet. The preview demonstrates the original evidence shell only.</p></section></main></body></html>
