<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Interaction Projects Preview</title>
<style>
:root{--bg:#101214;--ink:#f5efe3;--muted:#a39b8d;--blue:#6be4ff;--lime:#d8ff61;--line:rgba(245,239,227,.18)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}
main{min-height:100vh;padding:34px;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
.stage{min-height:540px;border:1px solid var(--line);position:relative;overflow:hidden;background:linear-gradient(180deg,#15191d,#0b0d0f);padding:28px}.path{position:absolute;left:14%;top:18%;width:70%;height:64%;border:1px dashed rgba(245,239,227,.28);border-radius:50%}.dot{position:absolute;width:86px;height:86px;border-radius:50%;background:var(--blue);box-shadow:0 0 44px rgba(107,228,255,.55);animation:orbit 6s linear infinite}.dot.one{left:12%;top:20%}.dot.two{right:10%;bottom:18%;background:var(--lime);animation-delay:-2.8s}h1{position:absolute;left:28px;bottom:28px;margin:0;font-size:clamp(48px,8vw,116px);line-height:.84;letter-spacing:-.07em;text-transform:uppercase}
.panel{display:grid;gap:16px}.card{border-top:1px solid var(--line);padding:18px 0}.k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}.v{font-size:28px;font-weight:850;line-height:1.08;margin-top:10px}.timeline{height:8px;background:rgba(245,239,227,.14);margin-top:16px;position:relative}.timeline:after{content:"";position:absolute;inset:0 48% 0 0;background:var(--blue)}
@keyframes orbit{0%{transform:translate(0,0) scale(.8)}50%{transform:translate(18vw,16vh) scale(1.12)}100%{transform:translate(0,0) scale(.8)}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}@media(max-width:820px){main{grid-template-columns:1fr;padding:20px}.stage{min-height:420px}}
</style>
</head>
<body>
<main>
  <section class="stage"><div class="path"></div><div class="dot one"></div><div class="dot two"></div><h1>Motion<br>Explains<br>State</h1></section>
  <aside class="panel">
    <div class="card"><div class="k">Sequence</div><div class="v">Scroll and pointer motion should clarify progress.</div><div class="timeline"></div></div>
    <div class="card"><div class="k">Interaction</div><div class="v">Every effect needs a reason, input model, and fallback.</div></div>
    <div class="card"><div class="k">Capture rule</div><div class="v">Record timing, trigger, state change, and reduced-motion behavior.</div></div>
  </aside>
</main>
</body>
</html>
