<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobile App Flow Projects</title><style>:root{--bg:#f4efe6;--ink:#20201e;--line:#cfc6b8;--paper:#fffdf8;--accent:#6a4fa3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}main{width:min(980px,calc(100% - 32px));margin:auto;padding:48px 0}h1{font:700 42px/1.05 Georgia,serif;margin:0 0 12px}.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.flow{display:flex;align-items:center;gap:16px;margin-top:30px;overflow:auto;padding:4px}.phone{flex:0 0 190px;height:310px;padding:20px 14px;border:2px solid var(--ink);border-radius:28px;background:var(--paper)}.notch{width:54px;height:6px;margin:0 auto 34px;border-radius:4px;background:var(--ink)}.block{height:14px;margin:12px 0;border-radius:6px;background:#ded7e8}.block.short{width:62%}.arrow{color:var(--accent);font-size:28px}.empty{margin-top:22px;color:#6b655d}@media(max-width:600px){h1{font-size:34px}.flow{align-items:flex-start}}</style></head><body><main><p class="eyebrow">Original local preview</p><h1>A flow is more than a screen.</h1><p>Record the task sequence, transition contract, platform constraints, and recovery states.</p><section class="flow" aria-label="Abstract original mobile flow"><div class="phone"><div class="notch"></div><div class="block"></div><div class="block short"></div></div><span class="arrow" aria-hidden="true">→</span><div class="phone"><div class="notch"></div><div class="block short"></div><div class="block"></div></div><span class="arrow" aria-hidden="true">→</span><div class="phone"><div class="notch"></div><div class="block"></div><div class="block"></div></div></section><p class="empty">No accepted references yet. This original diagram only demonstrates the sharded flow schema.</p></main></body></html>
