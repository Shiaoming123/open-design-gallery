<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campaign Visual Projects Preview</title>
<style>
:root{--ink:#101317;--paper:#f4f1e8;--acid:#c8ff36;--pink:#ff5f9a;--line:rgba(16,19,23,.16)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Arial,sans-serif}
main{min-height:100vh;padding:32px;display:grid;grid-template-columns:1.15fr .85fr;gap:26px}
.hero{position:relative;overflow:hidden;min-height:560px;border:1px solid var(--line);background:var(--ink);color:var(--paper);padding:30px;display:grid;align-content:end}.orb{position:absolute;width:58vw;height:58vw;left:10%;top:-15%;background:radial-gradient(circle,var(--pink),#3d64ff 58%,transparent 59%);filter:saturate(1.15)}.strip{position:absolute;inset:auto 0 28%;height:76px;background:var(--acid);transform:rotate(-7deg)}h1{position:relative;margin:0;font-size:clamp(58px,10vw,132px);line-height:.84;letter-spacing:-.07em;text-transform:uppercase}.tag{position:relative;margin-top:20px;font-size:12px;text-transform:uppercase;letter-spacing:.18em;color:rgba(244,241,232,.72)}
.cards{display:grid;gap:16px}.card{background:#fff;border:1px solid var(--line);padding:20px}.k{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:#7a7368}.v{font-size:28px;line-height:1.05;font-weight:850;margin-top:10px}.frames{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.frames span{aspect-ratio:1;border:1px solid var(--line);background:linear-gradient(135deg,var(--acid),var(--pink))}
@media(max-width:820px){main{grid-template-columns:1fr;padding:20px}.hero{min-height:430px}}
</style>
</head>
<body>
<main>
  <section class="hero"><div class="orb"></div><div class="strip"></div><h1>One Idea<br>Many<br>Frames</h1><div class="tag">Campaign hero / social crop / motion cutdown</div></section>
  <aside class="cards">
    <div class="card"><div class="k">Art direction</div><div class="v">Protect one focal point across every format.</div></div>
    <div class="card"><div class="k">Static + dynamic</div><div class="v">First frame must work without motion.</div><div class="frames"><span></span><span></span><span></span></div></div>
    <div class="card"><div class="k">Capture rule</div><div class="v">Record channels, crops, and reuse principles.</div></div>
  </aside>
</main>
</body>
</html>
